# SPDX-License-Identifier: Apache-2.0
#
# Toolbox images. Every change builds and tests each architecture on its own
# native runner (no emulation). Pushes to main and tags "toolbox-node/vN" also
# publish: each architecture by digest, then one multi-arch manifest,
# ghcr.io/portenv/toolbox-node, tagged sha-<commit> and main (or vN on a tag),
# with a build provenance attestation. Machines pull by digest.
name: Images

on:
  pull_request:
    paths:
      - images/**
      - core/**
      - proto/gen/go/**
      - go.work
      - .dockerignore
      - tests/e2e/**
      - server/**
      - Makefile
      - .github/workflows/images.yml
  push:
    branches: [main]
    paths:
      - images/**
      - core/**
      - proto/gen/go/**
      - go.work
      - .dockerignore
      - tests/e2e/**
      - server/**
      - Makefile
      - .github/workflows/images.yml
    tags:
      - toolbox-node/v*

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/portenv/toolbox-node

jobs:
  build:
    name: toolbox-node (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # used only when publishing (main and tags)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          docker build --platform "linux/${{ matrix.arch }}" \
            --build-arg VERSION="$(git describe --tags --always)" \
            --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            -f images/toolbox-node/Dockerfile -t toolbox-node:test .
      - name: Test
        run: images/toolbox-node/test.sh toolbox-node:test
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Driver conformance
        run: make driver-test IMAGE=toolbox-node:test
      - name: End-to-end (restic isolation, two machines)
        run: make e2e IMAGE=toolbox-node:test
      - name: Publish ${{ matrix.arch }}
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag toolbox-node:test "$IMAGE:sha-${GITHUB_SHA::12}-${{ matrix.arch }}"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}-${{ matrix.arch }}"

  manifest:
    name: Publish multi-arch manifest
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Create and push manifest
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tags=(-t "$IMAGE:sha-${GITHUB_SHA::12}")
          case "$REF" in
            refs/heads/main) tags+=(-t "$IMAGE:main") ;;
            refs/tags/toolbox-node/v*) tags+=(-t "$IMAGE:${REF_NAME#toolbox-node/}") ;;
          esac
          # Each architecture's digest, looked up by its per-commit tag.
          sources=()
          for arch in amd64 arm64; do
            d=$(docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::12}-$arch" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
            sources+=("$IMAGE@$d")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::12}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
