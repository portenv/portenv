syntax = "proto3";

// UNSTABLE: skeleton only. The API of portenv-agent, the box's init process,
// as portenvd and the runner call it. Terminals, lanes, port discovery and
// audit are designed in Phase 1; anything here may change.
package portenv.agent.v1;

import "portenv/types/v1/types.proto";

// The agent inside every box.
service AgentService {
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  // Reports whether the box has finished starting (users created, home
  // checked, packages installed).
  rpc GetReadiness(GetReadinessRequest) returns (GetReadinessResponse);
  // Try the packages that couldn't be installed again now (the Retry in the
  // inspector); the result shows in GetReadiness.
  rpc RetryPackages(RetryPackagesRequest) returns (RetryPackagesResponse);
  // Runs one allow-listed restic command as portenv-sync (ADR 0005). The
  // input carries the password and storage credentials; it is never logged.
  rpc RunRestic(RunResticRequest) returns (RunResticResponse);
  // Describes a path under /home for the sync engine.
  rpc GetPathInfo(GetPathInfoRequest) returns (GetPathInfoResponse);
  // Attaches a terminal to one of work's tmux sessions (created if needed).
  // The first message from the client must be open.
  rpc Terminal(stream TerminalRequest) returns (stream TerminalResponse);
  // The tabs of one of work's tmux sessions (created if needed), in order.
  // Every window in the session is a tab, whoever created it, so no window
  // is ever out of the user's sight.
  rpc ListTabs(ListTabsRequest) returns (ListTabsResponse);
  // Opens a tab at the end and shows it.
  rpc NewTab(NewTabRequest) returns (NewTabResponse);
  // Closes a tab and ends what runs in it. The last tab can't be closed.
  rpc CloseTab(CloseTabRequest) returns (CloseTabResponse);
  // Renames a tab. Programs in the box can't rename tabs.
  rpc RenameTab(RenameTabRequest) returns (RenameTabResponse);
  // Shows a tab in the session's terminal.
  rpc SelectTab(SelectTabRequest) returns (SelectTabResponse);
  // The tabs at once, then again whenever they change.
  rpc WatchTabs(WatchTabsRequest) returns (stream WatchTabsResponse);
  // One tab's terminal (ADR 0020): its own output from the session's
  // control-mode client, and input and size to it. The first message from
  // the client must be open. portenvd relays it as it relays Terminal, and
  // sets the stream's author from its caller (R-0133 item 4); the app's own
  // request to portenvd has no author field.
  rpc TabTerminal(stream TabTerminalRequest) returns (stream TabTerminalResponse);
  // ADR 0022: the agent team.
  // In-box portenv calls, relayed up. portenvd opens the stream; the helper
  // sends each call with the caller it read from the socket (SO_PEERCRED),
  // and portenvd, after its grant check, answers. The helper has no say in
  // grants.
  rpc TeamCalls(stream TeamCallsRequest) returns (stream TeamCallsResponse);
  // Starts an agent's tmux server and control client as its user, and its
  // runner in the first tab.
  rpc StartTeamAgent(StartTeamAgentRequest) returns (StartTeamAgentResponse);
  // Ends an agent's tmux server and every process of its user.
  rpc StopTeamAgent(StopTeamAgentRequest) returns (StopTeamAgentResponse);
  // The board's one writer: appends a line, on portenvd's instruction only.
  rpc AppendBoard(AppendBoardRequest) returns (AppendBoardResponse);
  // The Agent files view, each done in a process with the agent's uid.
  rpc ListHomeFiles(ListHomeFilesRequest) returns (ListHomeFilesResponse);
  rpc ReadHomeFile(ReadHomeFileRequest) returns (stream ReadHomeFileResponse);
  rpc WriteHomeFiles(stream WriteHomeFilesRequest) returns (WriteHomeFilesResponse);
  // The New-workspace team's agent files (ADR 0025 §5), written as work
  // into the project's .portenv/agents/, never over a file and never
  // through a link. A missing project folder is made empty, with git, on
  // main. Runs nothing from the files.
  rpc WriteAgentFiles(WriteAgentFilesRequest) returns (WriteAgentFilesResponse);
  // New workspace's From GitHub (ADR 0025 §2): clones a repository into
  // the project folder as work, https only, with no submodules, no LFS,
  // no credential helper and git's config from nowhere else; the size is
  // checked before and while bytes arrive. A project already there is left
  // as it is. Refusals: Unauthenticated (it needs a sign-in),
  // ResourceExhausted (too big), FailedPrecondition (anything else), each
  // with one plain line.
  rpc CloneProject(CloneProjectRequest) returns (CloneProjectResponse);
  // Served only by init (root) on its local socket, which only the API
  // process reaches; the channel's server answers Unimplemented. init checks
  // every id and package name itself.
  rpc EnsureAgentUser(EnsureAgentUserRequest) returns (EnsureAgentUserResponse);
  rpc RemoveAgentUser(RemoveAgentUserRequest) returns (RemoveAgentUserResponse);
  // apt-get -s for one requested package: the exact set, versions and sources.
  rpc SimulatePackage(SimulatePackageRequest) returns (SimulatePackageResponse);
  // Installs exactly the approved set, pinned, or nothing.
  rpc InstallPackages(InstallPackagesRequest) returns (InstallPackagesResponse);
  // Opens, focuses or closes a pane on an agent's own tmux server, as that
  // agent. portenvd calls it only after its grant check (at once for
  // panes: allow, on the owner's Approve for panes: ask).
  rpc AgentPaneAction(AgentPaneActionRequest) returns (AgentPaneActionResponse);
  // The board's lines from the start, for portenvd after a restart.
  rpc ReadBoard(ReadBoardRequest) returns (stream ReadBoardResponse);
  // The project's agent files (.portenv/agents/*.md), read by the helper.
  rpc ReadAgentFiles(ReadAgentFilesRequest) returns (ReadAgentFilesResponse);
  // Types a routine's note into the agent's own main pane, prefixed
  // "[Portenv routine] ", then Enter (R-0258). portenvd calls it only when
  // the agent is idle; the helper checks the text again and types only into
  // the agent's recorded main pane.
  rpc DeliverRoutine(DeliverRoutineRequest) returns (DeliverRoutineResponse);
  // Copies files from the sender's home or the project into the
  // recipient's ~/inbox/<sender>/<timestamp>/ as the recipient (R-0257
  // item 3): regular files only, no links, at most 100 MB, within quota.
  rpc HandoffFiles(HandoffFilesRequest) returns (HandoffFilesResponse);
  // Served only by init: makes the project readable by the team at team
  // start (ADR 0022 §2a, R-0315): /home/work 0711 with its dotfiles 0700;
  // every file in the project work's, with g:team:r-X and no write for
  // group team, other users or any named entry; no core.sharedRepository
  // and no system safe.directory from Portenv. Before it changes anything
  // it checks for what an agent could have changed in what work's git
  // reads, and refuses with a plain line if it finds any. Refuses too when
  // the filesystem won't keep ACLs.
  rpc PrepareTeamProject(PrepareTeamProjectRequest) returns (PrepareTeamProjectResponse);
  // Fetches an agent's branch into the owner's project as
  // refs/remotes/agents/<id> (ADR 0022 §2a point 3): as the agent, its
  // clone's agent/<id> is bundled; as work, that file alone is fetched,
  // with only the file protocol, no hooks or fsmonitor, every object
  // checked, no tags and no submodules. work's git never opens the agent's
  // repository.
  rpc FetchAgentBranch(FetchAgentBranchRequest) returns (FetchAgentBranchResponse);
  // Served only by init (relayed by the helper): the owner's answer to the
  // move to agents' own clones (ADR 0022 §2a point 6). Each recorded item
  // is removed or becomes work's; nothing is deleted without it. Refused
  // while any agent process runs.
  rpc ResolveTeamMigration(ResolveTeamMigrationRequest) returns (ResolveTeamMigrationResponse);
  // Wakes an idle agent for new board lines (CC-0498): types the fixed
  // line "[Portenv] new message from <from>; run portenv inbox", then
  // Enter, into the agent's own main pane, under exactly DeliverRoutine's
  // checks. The helper writes the line itself; no message text is ever
  // typed, and from must be an agent id or "owner".
  rpc WakeAgent(WakeAgentRequest) returns (WakeAgentResponse);
}

message RunResticRequest {
  // restic's arguments, without the binary name.
  repeated string args = 1;
  // The JSON input of portenv-agent restic: password, storage environment
  // and SFTP key.
  bytes input = 2;
}

message RunResticResponse {
  bytes stdout = 1;
  bytes stderr = 2;
  int32 exit_code = 3;
}

message GetPathInfoRequest {
  string path = 1;
}

message GetPathInfoResponse {
  bool exists = 1;
  bool is_dir = 2;
  bool empty = 3;
}

message TerminalRequest {
  oneof msg {
    TerminalOpen open = 1;
    // Keystrokes and pasted text.
    bytes input = 2;
    TerminalSize resize = 3;
  }
}

message TerminalOpen {
  // The tmux session, for example "main".
  string session = 1;
  TerminalSize size = 2;
  // Who is looking (for example "app"): each viewer has its own current
  // tab, in its own grouped tmux session over the same windows, so one
  // viewer choosing a tab never moves another's. Empty: the session itself.
  string viewer = 3;
  // Input comes from a pipe or a file, not a person typing (portenv
  // attach with stdin not a terminal). Input the program in the box never
  // read then ends the terminal with DataLoss; false (a person, or an
  // older client): never.
  bool input_piped = 4;
}

message TerminalSize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalResponse {
  oneof msg {
    bytes output = 1;
    // The terminal ended (the tmux client exited or detached).
    int32 exit_code = 2;
  }
}

message GetVersionRequest {}

message GetVersionResponse {
  portenv.types.v1.BuildInfo build = 1;
  // The box this helper runs in, as the driver told it when the box
  // started (R-0172, R-0173). portenvd refuses a channel that answers as
  // another box, which catches a misrouted channel (a stale forward, a
  // reused port). It's the helper's own claim, not proof of identity: that
  // stays with the channel's per-box TLS certificate and token, and
  // portenvd checks both. Empty only from a helper older than this field,
  // or one whose driver didn't pass it.
  string box_id = 2;
}

message GetReadinessRequest {}

// Where the box is in its start sequence.
enum ReadinessState {
  READINESS_STATE_UNSPECIFIED = 0;
  // Still starting: users, home checks, package replay.
  READINESS_STATE_STARTING = 1;
  // Started; the box is usable.
  READINESS_STATE_READY = 2;
  // The start sequence failed; detail says why. The box stays up so the
  // failure can be inspected.
  READINESS_STATE_FAILED = 3;
}

message GetReadinessResponse {
  ReadinessState state = 1;
  // Human-readable step or failure, e.g. "installing 2 packages".
  string detail = 2;
  // Packages from apt-packages.txt that couldn't be installed. They never
  // stop the box from starting; the agent retries them in the background.
  repeated string failed_packages = 3;
  // The last installation error for them (the log has the rest).
  string packages_error = 4;
}

message RetryPackagesRequest {}

message RetryPackagesResponse {}

message ListTabsRequest {
  string session = 1;
  // Who is looking (for example "app"): each viewer has its own current
  // tab, in its own grouped tmux session over the same windows, so one
  // viewer choosing a tab never moves another's. Empty: the session itself.
  string viewer = 2;
}

message ListTabsResponse {
  repeated portenv.types.v1.Tab tabs = 1;
}

message NewTabRequest {
  string session = 1;
  string name = 2;
  string viewer = 3;
}

message NewTabResponse {
  portenv.types.v1.Tab tab = 1;
}

message CloseTabRequest {
  string session = 1;
  string id = 2;
  string viewer = 3;
}

message CloseTabResponse {}

message RenameTabRequest {
  string session = 1;
  string id = 2;
  string name = 3;
  string viewer = 4;
}

message RenameTabResponse {}

message SelectTabRequest {
  string session = 1;
  string id = 2;
  string viewer = 3;
}

message SelectTabResponse {}

message WatchTabsRequest {
  string session = 1;
  string viewer = 2;
}

message WatchTabsResponse {
  repeated portenv.types.v1.Tab tabs = 1;
}

message TabTerminalRequest {
  oneof msg {
    TabTerminalOpen open = 1;
    // Keystrokes, pastes, clicks and IME input, as the app's terminal
    // produced them (never the emulator's replies; ADR 0020, decision 4).
    bytes input = 2;
    // The size this view can show, in cells. The tab takes the latest size
    // asked for, from any viewer.
    TerminalSize resize = 3;
  }
}

message TabTerminalOpen {
  // The tmux session, for example "main".
  string session = 1;
  // A tab ID, "@N".
  string tab = 2;
  TerminalSize size = 3;
  // Who types here, for attribution, as people read it (the owner's first
  // name, "Grok Bot"). Set by portenvd from its caller (the app over its
  // socket, or an agent's grant), never by a client. Empty: no author is
  // recorded for this stream's commands.
  string author = 4;
  // The author's agent ID (ADR 0016), set by portenvd; empty for a person.
  string author_agent_id = 5;
}

message TabTerminalResponse {
  oneof msg {
    // Always first, and again after the helper's control client restarts
    // or output had to be skipped (ADR 0020, decisions 6 and 11).
    TabTerminalReset reset = 1;
    // The tab's own output, in order.
    bytes output = 2;
    // The tab's size changed elsewhere (another viewer).
    TerminalSize resized = 3;
    // Nothing follows.
    TabTerminalEnd end = 4;
    // Who ran a command, for its block's attribution chip. Sent before the
    // output chunk in which the command's OSC 133;C mark completes.
    CommandAuthor author = 5;
  }
}

message TabTerminalReset {
  TerminalSize size = 1;
  // The tab's history and screen, cursor and modes, with the OSC 133
  // marks the helper knows replayed on their lines (ADR 0020, decision 6).
  bytes seed = 2;
  // Every command still in the seed that has a recorded author. Their
  // line values are the post-reflow lines at the time of the reset,
  // numbered the same way as this seed's marks.
  repeated CommandAuthor authors = 3;
  // Output was skipped since the last reset (the helper or its reader fell
  // too far behind; ADR 0020, decision 11): the app tells the person and
  // marks the block that was running as skipped, never complete.
  bool skipped = 4;
}

enum TabTerminalEnd {
  TAB_TERMINAL_END_UNSPECIFIED = 0;
  // The tab was closed (by anyone), or the tab asked for doesn't exist.
  TAB_TERMINAL_END_TAB_CLOSED = 1;
  // The box is stopping, or moving away.
  TAB_TERMINAL_END_BOX_STOPPING = 2;
}

// Who sent the Enter that started a command. Response-only: no request
// carries it. The workspace helper records it from the stream the Enter
// came through, whose identity portenvd set when the stream opened (ADR
// 0020, R-0133 item 4). The author never travels inside output bytes, not
// even as a private OSC: a workspace program can write any OSC and forge
// it, so it's only ever this separate message, and the app's filter keeps
// dropping unknown OSCs. A command with no recorded author (typed through
// a plain attach, or started by a program itself) gets no CommandAuthor at
// all; there is no "unknown" value.
//
// The app attaches each author to its mark when the chunk that completes
// that mark arrives. After that it follows the mark in the app's own row
// tracker across reflows, so the helper never resends authors after a
// resize. An author whose line has no mark completing in the next output
// chunk is dropped by the app: no chip, never a guess.
message CommandAuthor {
  // The command's OSC 133;C line, counted from the tab's first line ever,
  // the same counting as the seed's marks (R-0133 item 6).
  uint64 line = 1;
  // The author's own name, as people read it: the owner's first name, or
  // "Grok Bot". Never "You": is_you is what makes the app say "You".
  string name = 2;
  // Set by portenvd for each recipient: true when the author is the caller
  // receiving this stream. Never set by the helper or any client.
  bool is_you = 3;
  // Empty for a person; the agent's ID from its grant (ADR 0016) otherwise.
  string agent_id = 4;
  // For "also typed by" (GUIDELINES §4.2's "You and Grok Bot"), later.
  reserved 5;
}

// ADR 0022: the agent team.

// One in-box portenv call (ADR 0022 §4), from the helper up to portenvd:
// the response stream of TeamCalls.
message TeamCallsResponse {
  string call_id = 1;
  // From SO_PEERCRED, never from the request.
  string agent_id = 2;
  oneof op {
    Split split = 3;
    NewTeamTab tab = 4;
    PaneRef focus = 5;
    PaneRef close = 6;
    Msg msg = 7;
    AskOwner ask_owner = 8;
    Inbox inbox = 9;
    Share share = 10;
    ProposeAgentChange propose = 11;
    RequestPackage request_package = 12;
    WhoAmI whoami = 13;
    SetStatus set_status = 14;
    TeamStatus team_status = 15;
    Handoff handoff = 16;
    ProposeRoutine propose_routine = 17;
  }
}

// portenvd's answer to one call: the request stream of TeamCalls.
message TeamCallsRequest {
  string call_id = 1;
  bool ok = 2;
  // The plain line, for a refusal ("builder has 4 panes open, its limit.
  // Close one first.").
  string line = 3;
  oneof result {
    PaneRef pane = 4;
    InboxResult inbox = 5;
    portenv.types.v1.Decision decision = 6;
    portenv.types.v1.BoardMessage message = 7;
    WhoAmIResult whoami = 8;
    TeamStatusResult team_status = 9;
  }
}

// portenv split: splits the agent's own current pane.
message Split {
  // The agent's own pane to split.
  string pane_id = 1;
  // Right or down.
  bool down = 2;
  // Run with no shell.
  repeated string argv = 3;
}

// portenv tab new: a tab in the agent's own server.
message NewTeamTab {
  string name = 1;
  repeated string argv = 2;
}

message PaneRef {
  string pane_id = 1;
  string tab_id = 2;
}

message Msg {
  string to = 1;
  string thread_id = 2;
  portenv.types.v1.MessageType type = 3;
  string text = 4;
}

message AskOwner {
  string text = 1;
  string thread_id = 2;
  // --choice, in order: 2 to 4 labels, each 1 to 80 characters of plain
  // text (CC-0501). Empty asks a yes/no question.
  repeated string choices = 3;
}

message Inbox {
  string since_cursor = 1;
  // Wait for the next message or decision answer, up to a minute.
  bool wait = 2;
}

message InboxResult {
  repeated portenv.types.v1.BoardMessage messages = 1;
  // Its own decisions whose state changed.
  repeated portenv.types.v1.Decision decisions = 2;
  string cursor = 3;
}

message Share {
  // Empty for changes in the shared checkout.
  string branch = 1;
  string text = 2;
}

message ProposeAgentChange {
  // The agent file's id.
  string agent_id = 1;
  // The proposed content; portenvd makes the diff.
  string content = 2;
}

message RequestPackage {
  // One name in apt's grammar; init checks it again.
  string name = 1;
  string reason = 2;
}

message WhoAmI {}

// portenv whoami --json (R-0246): written by portenvd from what it
// enforces.
message WhoAmIResult {
  string id = 1;
  string name = 2;
  string role = 3;
  // The workspace and where it runs ("mac", "server" or "hosted").
  string workspace = 4;
  string location = 5;
  portenv.types.v1.AgentGrant grant = 6;
  int32 panes_open = 7;
  int64 home_bytes = 8;
  int64 home_quota_bytes = 9;
  int32 pending_decisions = 10;
  int32 package_requests_today = 11;
  repeated Teammate teammates = 12;
  // The portenv commands it may use now.
  repeated string commands = 13;
  // The runners on its PATH that pass the agent-file check.
  repeated string runners = 14;
  portenv.types.v1.AgentStatus status = 15;
  // Why its routines are off, if they are ("Portenv doesn't know when
  // this runner is idle").
  string routines_off = 16;
  // Set when its file asks for share_login, which this build doesn't
  // support: nothing is shared, so it signs in itself (R-0323).
  string share_login_off = 17;
}

message Teammate {
  string id = 1;
  string name = 2;
  string role = 3;
  portenv.types.v1.AgentState state = 4;
  // Only with team_status: read (R-0257 item 1).
  portenv.types.v1.AgentStatus status = 5;
  int32 pending_decisions = 6;
  // Seconds since its last board line or status.
  int64 idle_seconds = 7;
}

message StartTeamAgentRequest {
  string agent_id = 1;
  // The runner, run with no shell.
  repeated string argv = 2;
  // AGENTS.md in its home: the generated block (R-0246), then the file's
  // instructions.
  string agents_md = 3;
  // Repository paths copied into its home on first start (§2), from
  // project_dir: regular files and folders only, never through a link,
  // at most 100 MB together, new files only; ~/.portenv-seeded records it.
  repeated string home_seed = 4;
  int64 home_quota_bytes = 5;
  // The runner's idle-input pattern (RE2, matched against the main pane's
  // last line) from portenvd's runner table: DeliverRoutine types only
  // when it matches, with no question on screen, 5 s of quiet and not the
  // alternate screen. Empty: routines are off for this runner (R-0258).
  string idle_pattern = 6;
  // The owner's project, /home/work/<workspace>, for an agent with
  // checkout: own (ADR 0022 §2a): the helper makes the agent's own clone
  // at /home/<id>/<workspace> on agent/<id>, as the agent, if it's
  // missing, and starts the runner there. Empty: no clone, and the runner
  // starts in the agent's home.
  string clone_project_dir = 7;
  // Lenses (ADR 0022 §2a point 4): for each agent of the team with its own
  // clone, the agents that may read it. At every start the helper makes
  // every agent's clone readable by exactly these, as that agent, and by
  // no one else (an agent missing here: by no one). Applied only with
  // project_dir.
  repeated CloneReaders clone_readers = 8;
  // The owner's project, /home/<main user>/<workspace>: home_seed's paths
  // are copied from it, as the agent with the team group, on its first
  // start (ADR 0022 §2), and clone_readers apply to its agents' clones.
  // Required when home_seed isn't empty.
  string project_dir = 9;
  // The agent's display name, for its clone's git identity
  // ("<name> (Portenv agent)", set when the clone is made).
  string agent_name = 10;
}

// One writer's clone and the lenses that may read it.
message CloneReaders {
  string writer = 1;
  repeated string readers = 2;
}

message StartTeamAgentResponse {
  repeated portenv.types.v1.Tab tabs = 1;
}

message StopTeamAgentRequest {
  string agent_id = 1;
}

message StopTeamAgentResponse {}

message AppendBoardRequest {
  oneof line {
    portenv.types.v1.BoardMessage message = 1;
    portenv.types.v1.Decision decision = 2;
  }
}

message AppendBoardResponse {}

message ListHomeFilesRequest {
  string agent_id = 1;
  string dir = 2;
}

message ListHomeFilesResponse {
  repeated portenv.types.v1.AgentFile files = 1;
  int64 home_bytes = 2;
}

message ReadHomeFileRequest {
  string agent_id = 1;
  string path = 2;
}

message ReadHomeFileResponse {
  bytes data = 1;
}

message WriteHomeFilesRequest {
  // agent_id and quota on the first message only.
  string agent_id = 1;
  int64 home_quota_bytes = 2;
  string path = 3;
  bytes data = 4;
  bool last = 5;
}

message WriteHomeFilesResponse {
  repeated portenv.types.v1.AgentFile added = 1;
}

message EnsureAgentUserRequest {
  string agent_id = 1;
}

message EnsureAgentUserResponse {
  uint32 uid = 1;
  string home = 2;
  // Made now, rather than already there.
  bool created = 3;
  // The agent's run folder, /run/portenv-team/<id> (ADR 0022 section 1):
  // the helper's, the agent's group, setgid, 0710. init makes it, and
  // tmux_dir and tmp_dir in it (the agent's, 0700), at every call, since
  // /run is lost when the box stops. The helper listens on
  // run_dir/portenv.sock.
  string run_dir = 4;
  string tmux_dir = 5;
  string tmp_dir = 6;
}

message RemoveAgentUserRequest {
  string agent_id = 1;
  // Only after the owner approved DECISION_KIND_DELETE_AGENT_FILES.
  bool delete_files = 2;
}

message RemoveAgentUserResponse {}

message SimulatePackageRequest {
  string name = 1;
}

message SimulatePackageResponse {
  repeated portenv.types.v1.PackagePlan packages = 1;
  // A refusal (it would remove or downgrade, or install more than 50).
  string line = 2;
}

message InstallPackagesRequest {
  // The requested name, appended to apt-packages.txt on success.
  string name = 1;
  repeated portenv.types.v1.PackagePlan approved = 2;
  // The package decision (R-0254): init reads it from the board itself,
  // and installs only if it is approved and not expired, and a fresh
  // simulation equals its packages exactly (names, versions, sources).
  // Otherwise nothing is installed.
  string decision_id = 3;
}

message InstallPackagesResponse {
  bool ok = 1;
  // The result, or the failing line, for the agent's inbox.
  string line = 2;
}

message AgentPaneActionRequest {
  string agent_id = 1;
  oneof action {
    Split split = 2;
    NewTeamTab tab = 3;
    PaneRef focus = 4;
    PaneRef close = 5;
  }
}

message AgentPaneActionResponse {
  // The pane made or acted on.
  PaneRef pane = 1;
}

message ReadBoardRequest {}

// One board line, in the order written.
message ReadBoardResponse {
  oneof line {
    portenv.types.v1.BoardMessage message = 1;
    portenv.types.v1.Decision decision = 2;
  }
}

message ReadAgentFilesRequest {
  // The project folder inside the box, e.g. /home/work/<workspace>.
  string project_dir = 1;
}

message ReadAgentFilesResponse {
  repeated AgentFileContent files = 1;
}

// One agent file as the helper read it: its name (id.md) and its bytes.
message AgentFileContent {
  string name = 1;
  bytes content = 2;
}

// portenv status set|clear (R-0256).
message SetStatus {
  // Empty with clear.
  string text = 1;
  int32 progress_done = 2;
  int32 progress_total = 3;
  string blocked = 4;
  bool clear = 5;
}

// portenv team status (R-0257 item 1); needs team_status: read.
message TeamStatus {}

message TeamStatusResult {
  repeated Teammate teammates = 1;
}

// portenv handoff AGENT PATH [--note] (R-0257 item 3), under grant message.
message Handoff {
  string to = 1;
  // In the sender's home or the project, as the CLI resolved it.
  string path = 2;
  string note = 3;
}

// portenv routine propose (R-0258): an agent_file_change decision.
message ProposeRoutine {
  int32 every_minutes = 1;
  string note = 2;
}

message DeliverRoutineRequest {
  string agent_id = 1;
  // One plain line, without the prefix, at most 4078 bytes.
  string text = 2;
}

message DeliverRoutineResponse {}

message HandoffFilesRequest {
  string from_agent = 1;
  string to_agent = 2;
  // An absolute path in the box: the sender's home or the project.
  string source_path = 3;
  int64 recipient_quota_bytes = 4;
}

message HandoffFilesResponse {
  repeated portenv.types.v1.HandoffFile files = 1;
}

message FetchAgentBranchRequest {
  string agent_id = 1;
  // The owner's project, /home/work/<workspace>.
  string project_dir = 2;
  // The bundle's limit: the agent's home quota.
  int64 max_bytes = 3;
}

message FetchAgentBranchResponse {
  // refs/remotes/agents/<id>.
  string ref = 1;
  // Its commit, in full hex.
  string commit = 2;
}

message PrepareTeamProjectRequest {
  // The project folder, /home/work/<workspace>.
  string project_dir = 1;
  // For a workspace whose team used the shared project: the agents that
  // get their own clone in the move (ADR 0022 §2a point 6), and their
  // home quota.
  repeated string clone_agents = 2;
  int64 home_quota_bytes = 3;
  // Their display names, by id, for the clones' git identity.
  map<string, string> agent_names = 4;
}

message PrepareTeamProjectResponse {
  // What was made private in the owner's home (R-0262), since the last
  // team start, as plain lines for the owner's board notice.
  repeated string fixed = 1;
  // Not empty: the workspace's team used the shared project and was moved
  // to its own clones (ADR 0022 §2a point 6); the owner keeps or removes
  // each item (ResolveTeamMigration) before any agent starts.
  repeated portenv.types.v1.MigrationItem migration = 2;
}

message ResolveTeamMigrationRequest {
  string project_dir = 1;
  // Items to remove; the rest become work's.
  repeated string remove_items = 2;
}

message ResolveTeamMigrationResponse {}

message WakeAgentRequest {
  string agent_id = 1;
  // Who sent the newest unread line: an agent id or "owner".
  string from = 2;
  // How many lines came since the agent last read its inbox; more than
  // one makes the line plural. Never typed as a number.
  int32 count = 3;
}

message WakeAgentResponse {}

message WriteAgentFilesRequest {
  // The project folder, /home/work/<workspace>.
  string project_dir = 1;
  // Each path is <id>.md or off/<id>.md, relative to .portenv/agents/.
  repeated AgentFileContent files = 2;
}

message WriteAgentFilesResponse {
  // The paths written, and those already there (left as they are).
  repeated string written = 1;
  repeated string existing = 2;
  // Whether the project folder was made.
  bool made_project = 3;
}

message CloneProjectRequest {
  // The project folder, /home/work/<workspace>.
  string project_dir = 1;
  // https://github.com/OWNER/REPO.
  string url = 2;
  // The workspace's copies of the project: work's and each coding agent's.
  int32 copies = 3;
  // GitHub's size for it, in bytes; 0 when unknown.
  int64 estimate_bytes = 4;
}

message CloneProjectResponse {
  // The project was already there, so nothing was cloned.
  bool existed = 1;
  int64 bytes = 2;
}
