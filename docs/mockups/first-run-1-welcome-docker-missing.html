<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome: Docker Desktop is needed</title>
</head>
<body>
<style>
body{margin:0;background:#0E0E10}
a{color:#409CFF}a:hover{color:#6CB6FF}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<div style="width: 720px; height: 520px; box-sizing: border-box; display: flex; flex-direction: column; background: #1E1E20; color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; font-size: 13px; border: 1px solid #3A3A3D; border-radius: 12px; overflow: hidden">
<div aria-hidden="true" style="display: flex; gap: 8px; padding: 14px 16px">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 80px 36px; text-align: center">
<span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 18px; background: #2C2C2E; border: 1px solid #48484B; color: #F5F5F7">
<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"></path><path d="M5 20V10l7-6 7 6v10"></path><path d="M10 20v-5h4v5"></path></svg>
</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Welcome to Portenv</h1>
<p style="margin: 0; max-width: 420px; font-size: 14px; line-height: 1.5; color: #A1A1A6">Your portable workspace. Work on your Mac, continue on a server, and let your agents in, safely.</p>
<div role="status" style="display: flex; gap: 12px; align-items: flex-start; width: 460px; box-sizing: border-box; margin-top: 6px; padding: 14px 16px; border-radius: 12px; background: #2A2A2D; border: 1px solid #3A3A3D; text-align: left">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFB340" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l10 18H2z"></path><path d="M12 10v5"></path><path d="M12 18h.01"></path></svg>
<span style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
<span style="font-size: 13px; font-weight: 600">Portenv needs Docker Desktop for now</span>
<span style="font-size: 12px; line-height: 1.45; color: #C7C7CC">Install Docker Desktop and open it once. Portenv carries on by itself. A later version won’t need it.</span>
<span style="display: flex; align-items: center; gap: 10px; margin-top: 4px">
<button type="button" style="min-height: 28px; padding: 0 12px; background: #48484B; color: #F5F5F7; border: none; border-radius: 7px; font: inherit; font-size: 12px; cursor: pointer">Get Docker Desktop…</button>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8E8E93"><span aria-hidden="true" style="width: 10px; height: 10px; border: 1.5px solid #5A5A5E; border-top-color: #A1A1A6; border-radius: 50%; animation: spin 1s linear infinite"></span>Checking again by itself</span>
</span>
</span>
</div>
<button type="button" disabled aria-disabled="true" style="min-height: 34px; padding: 0 18px; border-radius: 17px; background: #2C2C2E; color: #6E6E73; border: none; font: inherit; font-size: 14px">Continue without an account</button>
</div>
</div>
</body>
</html>
