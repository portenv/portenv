# SPDX-License-Identifier: Apache-2.0
#
# Own-route guarantee (ADR 0008): the full own-route journey with every
# Portenv-hosted endpoint unreachable, using only locally built artifacts.
# Runs on every pull request and every merge to main; releases require it
# (docs/PLAN.md, 1.8).
name: Own route

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: own-route-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  own-route:
    name: own-route
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          tools: true
      - name: Build the CLI, agent and tools locally
        run: make build tools
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The layer cache in GitHub's cache (R-0203): the restic stage and the
      # agent stage's module download are skipped when their inputs haven't
      # changed, so proxy.golang.org, sum.golang.org and Docker Hub's mirror
      # are reached far less. Scoped per architecture; main's entries are
      # read by pull requests. No provenance or SBOM here, so the loaded image
      # is the plain image it always was (publishing attests separately).
      - name: Build the toolbox image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/toolbox-node/Dockerfile
          platforms: linux/amd64
          tags: toolbox-node:own-route
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=toolbox-node-amd64
          cache-to: type=gha,mode=max,scope=toolbox-node-amd64
      - name: Own-route journey with hosted endpoints blocked
        run: tests/e2e/own-route.sh toolbox-node:own-route
