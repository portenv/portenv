# SPDX-License-Identifier: Apache-2.0
#
# Toolbox images. Every change builds and tests each architecture on its own
# native runner (no emulation). Pushes to main and tags "toolbox-node/vN" also
# publish: each architecture by digest, then one multi-arch manifest,
# ghcr.io/portenv/toolbox-node, tagged sha-<commit> and main (or vN on a tag),
# with a build provenance attestation. Machines pull by digest.
name: Images

on:
  pull_request:
    paths:
      - images/**
      - core/**
      - proto/gen/go/**
      - go.work
      - .dockerignore
      - tests/e2e/**
      - tests/team-boundary/**
      - tests/team-start/**
      - server/**
      - Makefile
      - .github/workflows/images.yml
  push:
    branches: [main]
    paths:
      - images/**
      - core/**
      - proto/gen/go/**
      - go.work
      - .dockerignore
      - tests/e2e/**
      - tests/team-boundary/**
      - tests/team-start/**
      - server/**
      - Makefile
      - .github/workflows/images.yml
    tags:
      - toolbox-node/v*

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/portenv/toolbox-node

jobs:
  build:
    name: toolbox-node (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # used only when publishing (main and tags)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Version for the image
        id: version
        run: |
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # The layer cache in GitHub's cache (R-0203), for the two builder stages
      # only: restic, and the agent with its module download. They're what
      # reach proxy.golang.org and sum.golang.org, and they're small. The
      # whole image (Ubuntu, apt, Node) came to about 1.4 GB per architecture
      # and pushed the Go caches out of GitHub's 10 GB. Scoped per
      # architecture; main's entries are read by pull requests.
      - name: Cache the builder stages
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/toolbox-node/Dockerfile
          target: agent
          platforms: linux/${{ matrix.arch }}
          outputs: type=cacheonly
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha,scope=toolbox-node-builders-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=toolbox-node-builders-${{ matrix.arch }}
      # The image itself, reusing the builder stages just built or cached. No
      # provenance or SBOM here, so the loaded image is the plain image it
      # always was (publishing attests separately).
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/toolbox-node/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: toolbox-node:test
          load: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha,scope=toolbox-node-builders-${{ matrix.arch }}
      - name: Test
        run: images/toolbox-node/test.sh toolbox-node:test
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          tools: true
      - name: Driver conformance
        run: make driver-test IMAGE=toolbox-node:test
      # Every row of the per-agent user boundary (ADR 0022, section 12), each
      # proven by a mutation that must fail it. Fixture mode until lane C's
      # team start is in the image; the preview build is gated on real mode.
      - name: Agent team boundary
        run: make team-boundary IMAGE=toolbox-node:test
      - name: End-to-end (restic isolation, two machines)
        run: make e2e IMAGE=toolbox-node:test
      # An agent team's first start on a fresh workspace, as the owner
      # makes it in the app (R-0296): a real portenvd, portenv team init,
      # approve lead, the TEAM_START decision, start lead, whoami in its
      # pane, and its ask-owner in the decision list; then the agents' own
      # clones, with what ADR 0022 §2a's gate checks (R-0315).
      # No fixtures. After the other tests, so a failure here never hides
      # theirs.
      - name: Agent team first start
        run: make team-start IMAGE=toolbox-node:test
      - name: Publish ${{ matrix.arch }}
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag toolbox-node:test "$IMAGE:sha-${GITHUB_SHA::12}-${{ matrix.arch }}"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}-${{ matrix.arch }}"

  manifest:
    name: Publish multi-arch manifest
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Create and push manifest
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tags=(-t "$IMAGE:sha-${GITHUB_SHA::12}")
          case "$REF" in
            refs/heads/main) tags+=(-t "$IMAGE:main") ;;
            refs/tags/toolbox-node/v*) tags+=(-t "$IMAGE:${REF_NAME#toolbox-node/}") ;;
          esac
          # Each architecture's digest, looked up by its per-commit tag.
          sources=()
          for arch in amd64 arm64; do
            d=$(docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::12}-$arch" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
            sources+=("$IMAGE@$d")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::12}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
