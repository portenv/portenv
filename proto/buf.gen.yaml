# SPDX-License-Identifier: Apache-2.0
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/portenv/portenv/proto/gen/go
plugins:
  - local: ../bin/protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: ../bin/protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
