syntax = "proto3";

// UNSTABLE: skeleton only. The local API between Portenv.app and portenvd,
// served over a Unix socket in the user's Library folder and authenticated by
// peer credentials. Designed in milestone 1.1; anything here may change.
package portenv.daemon.v1;

import "google/protobuf/timestamp.proto";
import "portenv/types/v1/types.proto";

// The daemon that owns boxes on this Mac.
service DaemonService {
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  rpc ListBoxes(ListBoxesRequest) returns (ListBoxesResponse);
  // Opens a box on this Mac: the resume rules, then a running box.
  rpc OpenBox(OpenBoxRequest) returns (OpenBoxResponse);
  // Saves and releases the box and stops it.
  rpc CloseBox(CloseBoxRequest) returns (CloseBoxResponse);
  // Makes a save point (File › Make Save Point).
  rpc MakeSavePoint(MakeSavePointRequest) returns (MakeSavePointResponse);
  // Revert To ▸ Last Save Point: saves the current home first, then restores
  // the newest save point.
  rpc RevertToLastSavePoint(RevertToLastSavePointRequest) returns (RevertToLastSavePointResponse);
  // Move To ▸: closes the box here and opens it on the target.
  rpc MoveBox(MoveBoxRequest) returns (MoveBoxResponse);
  // Attaches a terminal to the box's tmux session through the box agent.
  rpc Terminal(stream TerminalRequest) returns (stream TerminalResponse);
  // Reports whether the box agent answers on its channel.
  rpc CheckBox(CheckBoxRequest) returns (CheckBoxResponse);
  // Restarts the box (for example after its agent became unavailable) and
  // opens it again through the resume rules: the local home is kept, never
  // restored over while it has unsaved changes.
  rpc RestartBox(RestartBoxRequest) returns (RestartBoxResponse);
  // The agent channel of a box open here (ADR 0010): its address on this
  // machine's loopback, the certificate the agent presents and the token.
  // Only for the owner of this socket; a Mac fetches it from a server's
  // runner over SSH and keeps it in memory.
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse);
  // The box's save state, derived only from what is recorded (the last
  // saved snapshot, the dirty flag, a save in progress) and where it runs.
  rpc GetBoxState(GetBoxStateRequest) returns (GetBoxStateResponse);
  // The box's state as it changes: the current state at once, then a
  // message whenever anything in it changes, and the state again every 30 s
  // as a heartbeat. The stream ends when portenvd stops (ADR 0014).
  rpc WatchBoxState(WatchBoxStateRequest) returns (stream WatchBoxStateResponse);
  // The system's network status, as the app sees it (NWPathMonitor on the
  // Mac). A fresh "down" (from a running app, at most 30 s old) opens a
  // box offline at once, without probing storage; anything else probes.
  rpc SetNetworkPath(SetNetworkPathRequest) returns (SetNetworkPathResponse);
  // The system woke from sleep: check every open box's agent channel and
  // restart a box whose channel is gone (its home stays: rule 3), so a
  // dropped channel never sits unnoticed until the next save.
  rpc Woke(WokeRequest) returns (WokeResponse);
  // Try the box's packages that couldn't be installed again now.
  rpc RetryPackages(RetryPackagesRequest) returns (RetryPackagesResponse);
  // Keys the app read from the Keychain for a box, held in memory only:
  // portenvd never reads the Keychain interactively, so when a key needs the
  // person's approval it fails fast and the app (in front of them) reads it.
  rpc ProvideKeys(ProvideKeysRequest) returns (ProvideKeysResponse);
  // Portenv is relaunching (an update): stop serving without closing any
  // box. Boxes and their programs keep running, and the next portenvd
  // takes them over (ADR 0014). Quitting (Cmd-Q) still closes and saves.
  rpc Relaunch(RelaunchRequest) returns (RelaunchResponse);
  // The servers a box can move to (Move To), as user@host.
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  // The Keychain items the app reads for a box (service
  // dev.portenv.repository): its repository key, and its storage keys.
  rpc GetKeyIDs(GetKeyIDsRequest) returns (GetKeyIDsResponse);
  // An autosave now (the Phase 0 CLI's save, moved here in 1.1).
  rpc SaveNow(SaveNowRequest) returns (SaveNowResponse);
  // Every save of the box, oldest first: autosaves, save points, closes and
  // orphaned saves, with the machine that made each.
  rpc ListSaves(ListSavesRequest) returns (ListSavesResponse);
  // Clear old lease tags and apply retention; with prune, also delete data
  // no save uses. For an idle box.
  rpc Housekeep(HousekeepRequest) returns (HousekeepResponse);
  // Quit Anyway: the box couldn't be saved before Portenv quits. portenvd
  // records the quit marker and keeps retrying the save in the background
  // (30 s, 1, 2 and 5 minutes, then every 5) until one succeeds; then it
  // closes the box and releases the lease. Until then the lease stays with
  // this Mac. Opening the box first stops the retries and saves it first
  // thing ("Portenv quit before saving").
  rpc LeaveUnsaved(LeaveUnsavedRequest) returns (LeaveUnsavedResponse);
  // Boxes saved in the background after Quit Anyway since the app last
  // asked: the app shows one notification for each. Given out once.
  rpc TakeSavedAfterQuit(TakeSavedAfterQuitRequest) returns (TakeSavedAfterQuitResponse);
  // The box's tabs (its terminal's tmux windows), through the box agent.
  // The session is "main" when empty.
  rpc ListTabs(ListTabsRequest) returns (ListTabsResponse);
  rpc NewTab(NewTabRequest) returns (NewTabResponse);
  rpc CloseTab(CloseTabRequest) returns (CloseTabResponse);
  rpc RenameTab(RenameTabRequest) returns (RenameTabResponse);
  rpc SelectTab(SelectTabRequest) returns (SelectTabResponse);
  // The tabs at once, then whenever they change. The stream ends when the
  // box closes or its agent goes away; the app watches again.
  rpc WatchTabs(WatchTabsRequest) returns (stream WatchTabsResponse);
  // Makes a new box from keys the app made and stored in the Keychain (ADR
  // 0019): writes no key to disk, creates the repository with the box's
  // repository key, adds the recovery-derived key, checks both, and only
  // then writes the box's config. Idempotent on box_id: calling again after
  // a failure or a crash resumes where it stopped. Never logged.
  rpc CreateBox(CreateBoxRequest) returns (CreateBoxResponse);
  // Forgets an unfinished creation (ListBoxes shows it as creating): the
  // name is free again. The repository it may have left, with no snapshot,
  // is never deleted.
  rpc DiscardCreation(DiscardCreationRequest) returns (DiscardCreationResponse);
  // Restores a box on this Mac with only the recovery key (ADR 0019): opens
  // the repository with the recovery-derived password, adds this Mac's new
  // repository key, checks it, and writes the box's config. Idempotent on
  // box_id. Never logged.
  rpc RecoverBox(RecoverBoxRequest) returns (RecoverBoxResponse);
  // Checks a typed recovery key before the app refills its pool from it
  // (ADR 0019): the recovery-derived passwords, one per box ID, are tried
  // against the boxes here that carry a recovery key. Read-only. Never
  // logged.
  rpc CheckRecoveryKey(CheckRecoveryKeyRequest) returns (CheckRecoveryKeyResponse);
  // Where a box is open when it isn't this Mac (2.3, the lease sheet): the
  // place, its newest save, and whether it answers. A known server is asked
  // with `portenv app ping`, within 2 s; another machine can't be asked.
  // OpenBox's refusal for a box open elsewhere carries the trailer
  // portenv-refusal: open-elsewhere, and the app asks this then.
  rpc GetPlacement(GetPlacementRequest) returns (GetPlacementResponse);
  // One tab's terminal (ADR 0020), relayed to the workspace helper's
  // TabTerminal as Terminal is: same socket, same box routing, on this Mac
  // or on a server. The first message must be open. portenvd sets the
  // stream's author from the connection's caller; nothing in the request
  // can, and the open has no author field.
  rpc TabTerminal(stream TabTerminalRequest) returns (stream TabTerminalResponse);
  // A server's host key (2.9, ADR 0021, R-0180), found through ssh itself
  // and compared, read only, with this Mac's SSH known hosts: the same key
  // confirms the server; a different one marks it changed. A server that
  // isn't confirmed is never contacted.
  rpc ScanServerKey(ScanServerKeyRequest) returns (ScanServerKeyResponse);
  // Pin the key the last scan found, given the fingerprint the person saw.
  // A changed key can't be trusted: only Forget gets past it.
  rpc TrustServerKey(TrustServerKeyRequest) returns (TrustServerKeyResponse);
  // Drop the server's pinned key: it is unconfirmed again.
  rpc ForgetServerKey(ForgetServerKeyRequest) returns (ForgetServerKeyResponse);
  // A made key's private half (2.9 1b, ADR 0021), read by the app from the
  // Keychain and held in portenvd's memory only, like ProvideKeys: never
  // written, never logged. It signs in once per shared connection, through
  // an agent of portenvd's own for that one run.
  rpc ProvideServerKey(ProvideServerKeyRequest) returns (ProvideServerKeyResponse);
  // Add a Server's Check (2.9, ADR 0021 §3): a read-only probe over the
  // server's pinned SSH connection, one line per question; each failure
  // says what to do, in Portenv's words, never the server's. It changes
  // nothing on the server.
  rpc CheckServer(CheckServerRequest) returns (CheckServerResponse);
  // Whether this Mac's box engine answers (Docker Desktop is running), for
  // Welcome's Docker card and the state line (R-0098). It only asks the
  // engine: it never starts anything. portenvd gives the engine 1.5 s;
  // the app waits 3 s for the answer.
  rpc GetEngine(GetEngineRequest) returns (GetEngineResponse);
  // ADR 0022: the agent team. Every call names the workspace; only the app,
  // in front of the person, makes them.
  // A workspace's agents, from its project's agent files.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // The agents, then every change, board message and decision, from a
  // cursor.
  rpc WatchTeam(WatchTeamRequest) returns (stream WatchTeamResponse);
  // Starts an agent whose file is approved and valid.
  rpc StartAgent(StartAgentRequest) returns (StartAgentResponse);
  // Stops an agent at once: its tmux server and every process of its user.
  rpc StopAgent(StopAgentRequest) returns (StopAgentResponse);
  // The owner's Fetch (ADR 0022 §2a): an agent's branch, agent/<id> in its
  // own clone, into the project as refs/remotes/agents/<id>, by the safe
  // fetch that never opens the agent's repository as work.
  rpc FetchAgentBranch(FetchAgentBranchRequest) returns (FetchAgentBranchResponse);
  // Approve or Decline, the owner's answer to a pending decision.
  rpc AnswerDecision(AnswerDecisionRequest) returns (AnswerDecisionResponse);
  // An agent file's content and the content last approved, for Approve's
  // diff and its runner line.
  rpc GetAgentFile(GetAgentFileRequest) returns (GetAgentFileResponse);
  // Pins an agent file's content (§3): the hash must be what the app showed.
  rpc ApproveAgentFile(ApproveAgentFileRequest) returns (ApproveAgentFileResponse);
  // The owner's message to an agent.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  // Removes an agent. Its files stay until the owner approves a
  // DECISION_KIND_DELETE_AGENT_FILES decision (§1).
  rpc RemoveAgent(RemoveAgentRequest) returns (RemoveAgentResponse);
  // The Agent files view (§2): list, open and add, done as the agent's user.
  rpc ListAgentFiles(ListAgentFilesRequest) returns (ListAgentFilesResponse);
  rpc ReadAgentFile(ReadAgentFileRequest) returns (stream ReadAgentFileResponse);
  // Drag and drop. Refused past the agent's quota.
  rpc AddAgentFiles(stream AddAgentFilesRequest) returns (AddAgentFilesResponse);
  // Pauses or resumes one of an agent's routines (R-0258).
  rpc SetRoutinePaused(SetRoutinePausedRequest) returns (SetRoutinePausedResponse);
  // Attachments (ADR 0030), the owner only: an agent caller is refused.
  // ReadAttachment streams one from this Mac's store, the record first.
  rpc ReadAttachment(ReadAttachmentRequest) returns (stream ReadAttachmentResponse);
  // The owner's files for agents (drop or Attach…): stored once, copied
  // into each agent's ~/inbox/owner/<time>/, one board notice per agent.
  rpc SendAttachments(stream SendAttachmentsRequest) returns (SendAttachmentsResponse);
  // Remove from this Mac: deletes one attachment's bytes; its records stay.
  rpc RemoveAttachment(RemoveAttachmentRequest) returns (RemoveAttachmentResponse);
}

message CheckBoxRequest {
  string name = 1;
}

message CheckBoxResponse {
  bool agent_available = 1;
  // Why not, when it is not.
  string detail = 2;
}

message RestartBoxRequest {
  string name = 1;
}

message RestartBoxResponse {
  string summary = 1;
  int32 rule = 2;
}

message OpenBoxRequest {
  string name = 1;
  // Take the lease from the machine that holds it (only on the user's
  // explicit choice). That machine's unsaved work is kept as a separate
  // save (resume rule 4).
  bool take_over = 2;
  // Connect to it where it runs (the lease sheet's Connect to it there):
  // one of this Mac's servers holds it. Nothing stops there. Refused when
  // no known server holds it or it's no longer open there.
  bool connect_there = 3;
}

message OpenBoxResponse {
  // A sentence for the title subtitle, for example "Saved 2 min ago".
  string summary = 1;
  // The resume rule that applied (1 to 5), or 0 when offline.
  int32 rule = 2;
  // Where the box runs: empty for this machine, else the server (user@host).
  string location = 3;
}

message CloseBoxRequest {
  string name = 1;
}

message CloseBoxResponse {}

message MakeSavePointRequest {
  string name = 1;
}

message MakeSavePointResponse {
  portenv.types.v1.SnapshotRef snapshot = 1;
}

message RevertToLastSavePointRequest {
  string name = 1;
}

message RevertToLastSavePointResponse {
  // The save point restored.
  portenv.types.v1.SnapshotRef restored = 1;
  // The save made of the home just before reverting, so it can be undone.
  portenv.types.v1.SnapshotRef saved_before = 2;
}

message MoveBoxRequest {
  string name = 1;
  // "this-mac", or an SSH host (user@host) that runs portenv.
  string target = 2;
}

message MoveBoxResponse {
  string summary = 1;
}

message TerminalRequest {
  oneof msg {
    TerminalOpen open = 1;
    bytes input = 2;
    TerminalSize resize = 3;
  }
}

message TerminalOpen {
  string box = 1;
  string session = 2;
  TerminalSize size = 3;
  // Who is looking (for example "app"): each viewer has its own current
  // tab, in its own grouped tmux session over the same windows, so one
  // viewer choosing a tab never moves another's. Empty: the session itself.
  string viewer = 4;
  // Input comes from a pipe or a file, not a person typing (portenv
  // attach with stdin not a terminal). Input the program in the box never
  // read then ends the terminal with DataLoss; false (a person, or an
  // older client): never.
  bool input_piped = 5;
}

message TerminalSize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalResponse {
  oneof msg {
    bytes output = 1;
    int32 exit_code = 2;
  }
}

message GetVersionRequest {}

message GetVersionResponse {
  portenv.types.v1.BuildInfo build = 1;
}

message ListBoxesRequest {}

message ListBoxesResponse {
  repeated BoxStatus boxes = 1;
}

// A box as this machine sees it.
message BoxStatus {
  portenv.types.v1.Box box = 1;
  portenv.types.v1.BoxState state = 2;
  // CreateBox started and hasn't finished: the box can't open yet. The app
  // finishes it (CreateBox again, the same box_id) or discards it
  // (DiscardCreation).
  bool creating = 3;
  // The box's repository also has the recovery-derived key (ADR 0019), so
  // a typed recovery key can be checked against it. Not a secret.
  bool carries_recovery_key = 4;
}

message GetChannelRequest {
  string name = 1;
}

message GetChannelResponse {
  // 127.0.0.1:PORT on the machine running the box.
  string address = 1;
  bytes cert_pem = 2;
  string token = 3;
}

message GetBoxStateRequest {
  string name = 1;
}

// What the title's save state shows.
enum SaveState {
  SAVE_STATE_UNSPECIFIED = 0;
  // Open, never saved (a new box).
  SAVE_STATE_NOT_SAVED_YET = 1;
  // A save is in progress.
  SAVE_STATE_SAVING = 2;
  // The last save completed at saved_at.
  SAVE_STATE_SAVED = 3;
  // Storage is unreachable; saves wait.
  SAVE_STATE_OFFLINE = 4;
  // The box agent's channel is down: nothing can be saved until a restart.
  SAVE_STATE_AGENT_UNAVAILABLE = 5;
  // Not open on this machine or its server.
  SAVE_STATE_CLOSED = 6;
  // A save missed its deadline and is being retried; saved_at is the last
  // save that completed ("Not saved since 14:58 · retrying").
  SAVE_STATE_RETRYING = 7;
  // The last save failed (after its retry); saved_at is the last one that
  // completed ("Not saved since 14:58"), until a save succeeds.
  SAVE_STATE_NOT_SAVED = 8;
  // Portenv quit before this box could be saved (Quit Anyway, or the app
  // ended); saved_at is the last save that completed. The box is saved first
  // thing when it opens ("Not saved since 15:54 · Portenv quit before
  // saving"), and this clears once a save succeeds.
  SAVE_STATE_QUIT_UNSAVED = 9;
}

message GetBoxStateResponse {
  SaveState state = 1;
  google.protobuf.Timestamp saved_at = 2;
  // Where the box runs: empty for this machine, else the server.
  string location = 3;
  // Packages from apt-packages.txt that couldn't be installed (shown in the
  // inspector's Where it is section with Retry; never in the state line).
  repeated string failed_packages = 4;
  string packages_error = 5;
  // The box was open when the previous portenvd ended without closing it
  // (crash, update, relaunch): it isn't closed, but this portenvd hasn't
  // opened it and holds none of its keys. The app opens it again, handing
  // the keys over; state and saved_at say when it was last saved.
  bool interrupted = 6;
  // Where the box's saves go, as a place name only ("this Mac", a drive, or
  // the storage server's host): the inspector's "Saves go to <place>". Never
  // a path, a user or a credential. Empty when not known here.
  string storage_place = 7;
  // When this portenvd opened the box (the inspector's "Since <time>").
  google.protobuf.Timestamp opened_at = 8;
  // This open stopped and started the box again to apply a security update
  // (it was left running with mounts it shouldn't have; R-0201). The app
  // tells the person once. Only for the open that did it.
  bool restarted_for_security_update = 9;
  // While this open pulls the workspace's toolbox image (the first open):
  // how far it has got (R-0211). Unset otherwise.
  ImagePull image_pull = 10;
}

enum NetworkPath {
  NETWORK_PATH_UNSPECIFIED = 0;
  // Some network is usable: probe the storage before opening online.
  NETWORK_PATH_SATISFIED = 1;
  // No network at all: storage cannot be reachable.
  NETWORK_PATH_UNSATISFIED = 2;
}

message SetNetworkPathRequest {
  NetworkPath path = 1;
  // The app that saw this status (the portenv command's parent). A "down"
  // counts only while that process runs and for 30 s after the report.
  int32 reporter_pid = 2;
}

message SetNetworkPathResponse {}

message WokeRequest {}

message WokeResponse {
  repeated WokeBox boxes = 1;
}

// One open box after a wake.
message WokeBox {
  string name = 1;
  // The channel answered.
  bool agent_available = 2;
  // The channel was gone and the box was restarted.
  bool restarted = 3;
  // Why a restart failed, when it did.
  string detail = 4;
}

message RetryPackagesRequest {
  string name = 1;
}

message RetryPackagesResponse {}

message ProvideKeysRequest {
  string name = 1;
  // Key ID (the box ID, its storage key, its REST password) to key.
  map<string, bytes> keys = 2;
}

message ProvideKeysResponse {}

message RelaunchRequest {}

message RelaunchResponse {}

message WatchBoxStateRequest {
  string name = 1;
}

message WatchBoxStateResponse {
  GetBoxStateResponse state = 1;
}

message ListServersRequest {}

message ListServersResponse {
  repeated string servers = 1;
  // Each server's host key, in the order of servers, by ID and name (never
  // its address).
  repeated ServerInfo infos = 2;
}

message GetKeyIDsRequest {
  string name = 1;
}

message GetKeyIDsResponse {
  repeated string key_ids = 1;
}

message SaveNowRequest {
  string name = 1;
}

message SaveNowResponse {
  portenv.types.v1.SnapshotRef snapshot = 1;
}

message ListSavesRequest {
  string name = 1;
}

message ListSavesResponse {
  repeated SaveEntry saves = 1;
}

// One save in a box's history.
message SaveEntry {
  string id = 1;
  google.protobuf.Timestamp time = 2;
  // autosave, point, release (a close) or orphaned.
  string kind = 3;
  // The machine that made it.
  string machine = 4;
  // The machine the box is open on, for the current save only.
  string open_on = 5;
}

message HousekeepRequest {
  string name = 1;
  bool prune = 2;
}

message HousekeepResponse {}

message LeaveUnsavedRequest {
  string name = 1;
}

message LeaveUnsavedResponse {}

message TakeSavedAfterQuitRequest {}

message TakeSavedAfterQuitResponse {
  repeated SavedAfterQuit saved = 1;
}

// A box saved in the background after Quit Anyway.
message SavedAfterQuit {
  string name = 1;
  google.protobuf.Timestamp saved_at = 2;
}

message ListTabsRequest {
  string box = 1;
  string session = 2;
  // Who is looking (for example "app"): each viewer has its own current
  // tab, in its own grouped tmux session over the same windows, so one
  // viewer choosing a tab never moves another's. Empty: the session itself.
  string viewer = 3;
}

message ListTabsResponse {
  repeated portenv.types.v1.Tab tabs = 1;
}

message NewTabRequest {
  string box = 1;
  string session = 2;
  string name = 3;
  string viewer = 4;
}

message NewTabResponse {
  portenv.types.v1.Tab tab = 1;
}

message CloseTabRequest {
  string box = 1;
  string session = 2;
  string id = 3;
  string viewer = 4;
}

message CloseTabResponse {}

message RenameTabRequest {
  string box = 1;
  string session = 2;
  string id = 3;
  string name = 4;
  string viewer = 5;
}

message RenameTabResponse {}

message SelectTabRequest {
  string box = 1;
  string session = 2;
  string id = 3;
  string viewer = 4;
}

message SelectTabResponse {}

message WatchTabsRequest {
  string box = 1;
  string session = 2;
  string viewer = 3;
}

message WatchTabsResponse {
  repeated portenv.types.v1.Tab tabs = 1;
}

message CreateBoxRequest {
  // The box name rule (letters, digits, '.', '_', '-').
  string name = 1;
  // From the app's pool: box- and 12 lowercase hex digits.
  string box_id = 2;
  // Empty: the default toolbox.
  string image = 3;
  // As a box's config: empty for this Mac only, or an absolute directory.
  // (SFTP and S3 storage come with the server setup, 2.9.)
  string storage = 4;
  string storage_host_key = 5;
  string storage_rest = 6;
  // Exactly the box's key IDs for this storage (GetKeyIDs), as in
  // ProvideKeys. Held in memory only, like ProvideKeys.
  map<string, bytes> keys = 7;
  // The recovery-derived restic password (64 lowercase hex characters).
  // Used to add and check the recovery key, then dropped: never stored,
  // never logged. The recovery key itself never reaches portenvd.
  bytes recovery_password = 8;
}

message CreateBoxResponse {
  string box_id = 1;
  // An earlier call had finished it.
  bool already_created = 2;
}

message DiscardCreationRequest {
  string box_id = 1;
}

message DiscardCreationResponse {}

message RecoverBoxRequest {
  // The name the box gets on this Mac.
  string name = 1;
  // From a listing of the storage's boxes folder.
  string box_id = 2;
  // Empty: the default toolbox.
  string image = 3;
  // Where the box's repository is, as in CreateBoxRequest.
  string storage = 4;
  string storage_host_key = 5;
  string storage_rest = 6;
  // This Mac's new keys for the box (its key IDs, as in CreateBox), which
  // the app made and stored in the Keychain first. Held in memory only.
  map<string, bytes> keys = 7;
  // The recovery-derived restic password for this box ID. Opens the
  // repository to add the new repository key, then dropped.
  bytes recovery_password = 8;
}

message RecoverBoxResponse {
  string box_id = 1;
  // An earlier call had finished it.
  bool already_recovered = 2;
}

message CheckRecoveryKeyRequest {
  // Box ID to its recovery-derived restic password (64 hex characters),
  // never the recovery key itself. At most 64, and at most as many as
  // the boxes here with carries_recovery_key: more is InvalidArgument.
  map<string, bytes> recovery_passwords = 1;
}

message CheckRecoveryKeyResponse {
  // How many boxes here carry a recovery key and could be checked.
  int32 checked = 1;
  // The key opened one of them.
  bool opened = 2;
}

message GetPlacementRequest {
  string name = 1;
  // Ask a known server whether it answers (up to 2 s). Without it, the
  // answer comes at once with answers unspecified for a known server, so
  // the sheet can name the place before the probe ends.
  bool probe = 2;
}

// Who holds a box open.
enum Holder {
  HOLDER_UNSPECIFIED = 0;
  // Nobody, or this Mac: OpenBox opens it here.
  HOLDER_NONE = 1;
  // One of this Mac's servers (server_id, server_name).
  HOLDER_KNOWN_SERVER = 2;
  // A machine this Mac can't reach: another Mac, or a server it doesn't
  // know (machine is its machine ID).
  HOLDER_OTHER_MACHINE = 3;
}

// Whether the holder answers.
enum Answers {
  ANSWERS_UNSPECIFIED = 0;
  ANSWERS_YES = 1;
  // A known server whose portenv app ping failed or took over 2 s.
  ANSWERS_NO = 2;
  // Another machine: Portenv can't ask it. Never a reason to take over by
  // default (R-0168).
  ANSWERS_CANNOT_ASK = 3;
}

message GetPlacementResponse {
  // Servers show by name, never by address (GUIDELINES §2, R-0172): the
  // address stays in portenvd.
  reserved 2;
  reserved "server";
  Holder holder = 1;
  // For HOLDER_KNOWN_SERVER: a stable ID for the server (it doesn't carry
  // the address) and the name it shows by.
  string server_id = 6;
  string server_name = 7;
  // The holder's machine ID, as the lease names it.
  string machine = 3;
  // The newest save, which carries the lease.
  google.protobuf.Timestamp newest_save_at = 4;
  Answers answers = 5;
}

message TabTerminalRequest {
  oneof msg {
    TabTerminalOpen open = 1;
    // Keystrokes, pastes, clicks and IME input, as the app's terminal
    // produced them (never the emulator's replies; ADR 0020, decision 4).
    bytes input = 2;
    // The size this view can show, in cells.
    TerminalSize resize = 3;
  }
}

message TabTerminalOpen {
  // The tmux session, for example "main".
  string session = 1;
  // A tab ID, "@N".
  string tab = 2;
  TerminalSize size = 3;
  // The helper's TabTerminalOpen has author at 4. Here it's reserved, so
  // no client can send one, and a stray field 4 is never copied through:
  // portenvd builds the helper's open from the fields below and its caller.
  reserved 4;
  reserved "author";
  string box = 5;
}

message TabTerminalResponse {
  oneof msg {
    // Always first, and again after the helper's control client restarts
    // or output had to be skipped.
    TabTerminalReset reset = 1;
    // The tab's own output, in order.
    bytes output = 2;
    // The tab's size changed elsewhere (another viewer).
    TerminalSize resized = 3;
    // Nothing follows.
    portenv.types.v1.TabTerminalEnd end = 4;
    // Who ran a command, for its block's attribution chip.
    CommandAuthor author = 5;
  }
}

message TabTerminalReset {
  TerminalSize size = 1;
  // The tab's history and screen, cursor and modes, with its OSC 133
  // marks replayed on their lines.
  bytes seed = 2;
  // Every command still in the seed that has a recorded author.
  repeated CommandAuthor authors = 3;
  // Output was skipped since the last reset (the helper or its reader fell
  // too far behind; ADR 0020, decision 11): the app tells the person and
  // marks the block that was running as skipped, never complete.
  bool skipped = 4;
}

// Who sent the Enter that started a command: the helper's CommandAuthor
// (agent.v1), as portenvd hands it to one recipient. Response-only, and
// never inside output bytes. A command with no recorded author has none.
message CommandAuthor {
  // The command's OSC 133;C line, counted from the tab's first line ever.
  uint64 line = 1;
  // The author's own name, as people read it: the owner's first name, or
  // "Grok Bot". Never "You": is_you is what makes the app say "You".
  // portenvd drops an author whose name is over 64 characters or has
  // control or bidi characters; it never repairs one.
  string name = 2;
  // True when the author is the caller receiving this stream. Set by
  // portenvd for each recipient; whatever the helper sent is replaced.
  bool is_you = 3;
  // Empty for a person; the agent's ID from its grant (ADR 0016) otherwise.
  string agent_id = 4;
  reserved 5;
}

message ServerInfo {
  string id = 1;
  string name = 2;
  portenv.types.v1.ServerKeyState state = 3;
  // The pinned key's fingerprint (SHA256:..., as OpenSSH shows it), or the
  // last scan's while it waits to be trusted.
  string fingerprint = 4;
  // Confirmed because this Mac's SSH known hosts had the same key.
  bool from_known_hosts = 5;
  // Its key changed and was forgotten: the next confirmation says so
  // first. Cleared on Trust (R-0185).
  bool was_changed = 6;
  // It signs in with a key Portenv made for it: the app hands that key
  // over (ProvideServerKey).
  bool made_key = 7;
}

message ScanServerKeyRequest {
  string server_id = 1;
}

message ScanServerKeyResponse {
  ServerInfo info = 1;
  // ssh-ed25519, ecdsa-sha2-nistp256, ...; never a certificate.
  string key_type = 2;
}

message TrustServerKeyRequest {
  string server_id = 1;
  string fingerprint = 2;
}

message TrustServerKeyResponse {
  ServerInfo info = 1;
}

message ForgetServerKeyRequest {
  string server_id = 1;
}

message ForgetServerKeyResponse {
  ServerInfo info = 1;
}

message ProvideServerKeyRequest {
  string server_id = 1;
  // The Ed25519 private key's 32-byte seed.
  bytes key = 2;
}

message ProvideServerKeyResponse {}

message CheckServerRequest {
  string server_id = 1;
}

message CheckLine {
  string id = 1;
  string title = 2;
  portenv.types.v1.CheckState state = 3;
  // What Portenv found, in its own words.
  string detail = 4;
  // For a failure: what to do, one plain line.
  string fix = 5;
}

message CheckServerResponse {
  repeated CheckLine lines = 1;
  // No line failed: Set Up may install.
  bool passed = 2;
}

message GetEngineRequest {}

message GetEngineResponse {
  // The engine answered.
  bool running = 1;
}

// A toolbox image's pull: bytes fetched of the bytes known so far (the
// total grows as Docker starts each layer).
message ImagePull {
  int64 done_bytes = 1;
  int64 total_bytes = 2;
}

// ADR 0022: the agent team.

message ListAgentsRequest {
  // The workspace.
  string name = 1;
}

message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

// One agent, as the Team sidebar shows it.
message AgentInfo {
  // Its id, which is also its login name in the workspace.
  string id = 1;
  string name = 2;
  string role = 3;
  // An SF Symbol name, or one of GUIDELINES §11's agent colours.
  string avatar = 4;
  // Remote agents (§10), after the owner's run.
  bool remote = 5;
  // "ssh", "mcp" or "web" when remote.
  string via = 6;
  portenv.types.v1.AgentState state = 7;
  // One plain line when it's invalid or a start failed.
  string problem = 8;
  // The agent file's content hash, and whether it's the approved one.
  string file_sha256 = 9;
  bool approved = 10;
  // Its tabs, in the order of ListTabs.
  repeated string tab_ids = 11;
  // Its last board line, plain text.
  string last_line = 12;
  int32 pending_decisions = 13;
  // Its home's size and limit (§2's quota).
  int64 home_bytes = 14;
  int64 home_quota_bytes = 15;
  // The runner line from its file, which Approve shows prominently
  // (R-0245 item 4).
  string runner = 16;
  portenv.types.v1.AgentGrant grant = 17;
  // What it says it's working on (R-0256); empty when it hasn't said.
  portenv.types.v1.AgentStatus status = 18;
  // Its routines (R-0258).
  repeated portenv.types.v1.Routine routines = 19;
  // Why its routines are off, if they are (R-0258).
  string routines_off = 20;
  // Set when its file asks for share_login, which this build doesn't
  // support: one plain line saying nothing is shared (R-0323).
  string share_login_off = 21;
}

message WatchTeamRequest {
  string name = 1;
  // Empty for everything from the start of the board.
  string cursor = 2;
}

message WatchTeamResponse {
  oneof event {
    AgentInfo agent = 1;
    portenv.types.v1.BoardMessage message = 2;
    portenv.types.v1.Decision decision = 3;
    string removed_agent_id = 5;
  }
  string cursor = 4;
}

message FetchAgentBranchRequest {
  string name = 1;
  string agent_id = 2;
}

message FetchAgentBranchResponse {
  // refs/remotes/agents/<id>.
  string ref = 1;
  string commit = 2;
}

message StartAgentRequest {
  string name = 1;
  string agent_id = 2;
}

message StartAgentResponse {
  AgentInfo agent = 1;
}

message StopAgentRequest {
  string name = 1;
  string agent_id = 2;
}

message StopAgentResponse {
  AgentInfo agent = 1;
}

message AnswerDecisionRequest {
  string name = 1;
  string decision_id = 2;
  bool approve = 3;
  string note = 4;
  // For a decision with choices (CC-0501): the chosen one, counting from
  // 1, with approve true. portenvd refuses it unless choice_label is
  // exactly the decision's stored choices[choice-1]. 0 for Decline and for
  // a decision without choices.
  int32 choice = 5;
  string choice_label = 6;
  // For a team_start decision with migration items: the items to remove
  // (their ids). Every other item is kept: it becomes the owner's.
  repeated string remove_items = 7;
}

message AnswerDecisionResponse {
  portenv.types.v1.Decision decision = 1;
}

message GetAgentFileRequest {
  string name = 1;
  string agent_id = 2;
}

message GetAgentFileResponse {
  // The file as it is now, and its hash.
  string content = 1;
  string file_sha256 = 2;
  // The content last approved, empty if none was.
  string approved_content = 3;
  string runner = 4;
}

message ApproveAgentFileRequest {
  string name = 1;
  string agent_id = 2;
  // Must match the content the app showed, or nothing is approved.
  string file_sha256 = 3;
}

message ApproveAgentFileResponse {
  AgentInfo agent = 1;
}

message SendMessageRequest {
  string name = 1;
  // An agent id. From is always "owner".
  string to = 2;
  string thread_id = 3;
  string text = 4;
  // NOTICE (the default) or STATUS_REQUEST (Ask for Status, R-0256).
  portenv.types.v1.MessageType type = 5;
}

message SendMessageResponse {
  portenv.types.v1.BoardMessage message = 1;
}

message RemoveAgentRequest {
  string name = 1;
  string agent_id = 2;
}

message RemoveAgentResponse {
  // The decision to delete its files, if the owner wants that.
  portenv.types.v1.Decision delete_files = 1;
}

message ListAgentFilesRequest {
  string name = 1;
  string agent_id = 2;
  // A folder relative to the agent's home; empty for the home.
  string dir = 3;
}

message ListAgentFilesResponse {
  repeated portenv.types.v1.AgentFile files = 1;
  int64 home_bytes = 2;
  int64 home_quota_bytes = 3;
}

message ReadAgentFileRequest {
  string name = 1;
  string agent_id = 2;
  string path = 3;
}

// A piece of the file, in order.
message ReadAgentFileResponse {
  bytes data = 1;
}

message AddAgentFilesRequest {
  // name and agent_id on the first message only.
  string name = 1;
  string agent_id = 2;
  // Relative to the agent's home; a new path starts a new file.
  string path = 3;
  bytes data = 4;
  // The last piece of this file.
  bool last = 5;
}

message AddAgentFilesResponse {
  repeated portenv.types.v1.AgentFile added = 1;
}

message SetRoutinePausedRequest {
  string name = 1;
  string agent_id = 2;
  // The routine's place in the agent file's list.
  int32 index = 3;
  bool paused = 4;
}

message SetRoutinePausedResponse {
  AgentInfo agent = 1;
}

message ReadAttachmentRequest {
  // The workspace.
  string name = 1;
  string attachment_id = 2;
}

// The record on the first message, then the bytes in pieces.
message ReadAttachmentResponse {
  portenv.types.v1.Attachment attachment = 1;
  bytes data = 2;
}

// name, to, thread_id and pane_id on the first message; then one file at a
// time: file_name and size on its first piece, last_of_file on its last.
message SendAttachmentsRequest {
  string name = 1;
  // Agent ids; each gets its own copy.
  repeated string to = 2;
  string thread_id = 3;
  // The pane it was dropped on, if any (one agent only).
  string pane_id = 4;
  // The base name only; the Mac path never leaves the app.
  string file_name = 5;
  int64 size = 6;
  bytes data = 7;
  bool last_of_file = 8;
}

message SendAttachmentsResponse {
  // One per agent that got its copies.
  repeated portenv.types.v1.BoardMessage messages = 1;
  // One plain line per agent or file that didn't.
  repeated string refused = 2;
  // For a drop on a pane: how the path was offered, and the path.
  portenv.types.v1.InsertHow inserted = 3;
  string inserted_path = 4;
}

message RemoveAttachmentRequest {
  string name = 1;
  string attachment_id = 2;
}

message RemoveAttachmentResponse {}
