<h1 style="margin: 0; font-size: 24px; font-weight: 700">How should your boxes be protected?</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #A1A1A6">Everything is encrypted on your Mac before it's saved anywhere. Choose who can unlock it.</p>
</div>
<div role="radiogroup" aria-label="Protection" style="display: flex; flex-direction: column; gap: 12px">
<button type="button" role="radio" aria-checked="checked" style="display: flex; gap: 14px; padding: 16px; background: #1D2633; color: #F5F5F7; border: 2px solid #0A84FF; border-radius: 12px; font: inherit; text-align: left; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; font-weight: 600">Only you</span>
<span style="font-size: 13px; line-height: 1.45; color: #C7C7CC">Keys never leave your devices. If you lose every device and your recovery key, nobody can get your work back, including Portenv.</span>
</span>
</button>
<button type="button" role="radio" aria-checked="checked" style="display: flex; gap: 14px; padding: 16px; background: #2A2A2D; color: #F5F5F7; border: 2px solid #3A3A3D; border-radius: 12px; font: inherit; text-align: left; cursor: pointer">

<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; font-weight: 600">You, with Portenv's help</span>
<span style="font-size: 13px; line-height: 1.45; color: #C7C7CC">Portenv keeps a backup key so you can recover your account. This means Portenv could technically unlock your boxes.</span>
</span>
</button>
