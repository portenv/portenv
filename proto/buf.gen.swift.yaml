# Swift for the app (make proto-swift): the daemon API and what it imports,
# client side only. The plugins are pinned in tools/swift-protoc.
version: v2
plugins:
  - local: ../bin/protoc-gen-swift
    out: gen/swift/Sources/PortenvProto
    opt:
      - Visibility=Public
      - FileNaming=PathToUnderscores
  - local: ../bin/protoc-gen-grpc-swift-2
    out: gen/swift/Sources/PortenvProto
    opt:
      - Visibility=Public
      - Client=true
      - Server=false
      - FileNaming=PathToUnderscores
