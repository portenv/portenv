# SPDX-License-Identifier: Apache-2.0
#
# Channel conditions under load: proves TestChannelConditions' targeted
# checks are stable by running the test 20 times while stress-ng loads the
# CPU, memory and disk. Runs on PRs that touch the driver, the agent, the
# toolbox image or this workflow. Every run's result is reported; any
# failure fails the job.
name: Channel stress

on:
  pull_request:
    paths:
      - core/driver/**
      - core/agent/**
      - images/**
      - .github/workflows/channel-stress.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: channel-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: TestChannelConditions x20 under load
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Version for the image
        id: version
        run: |
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # The builder stages' layer cache (R-0203), read only: the Images
      # workflow writes it. The restic stage and the agent stage's module
      # download are skipped when their inputs haven't changed. No provenance or SBOM here, so the loaded image
      # is the plain image it always was (publishing attests separately).
      - name: Build the toolbox image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/toolbox-node/Dockerfile
          platforms: linux/amd64
          tags: toolbox-node:stress
          load: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha,scope=toolbox-node-builders-amd64
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
      - name: Install stress-ng
        run: command -v stress-ng || { sudo apt-get update -q && sudo apt-get install -y -q stress-ng; }
      - name: 20 runs under load
        run: |
          set -euo pipefail
          (cd core && go test -c -o "$RUNNER_TEMP/docker.test" ./driver/docker/)
          # CPU on every core, memory pressure and disk writes, for longer
          # than the runs take; stopped when they're done.
          stress-ng --cpu 0 --vm 1 --vm-bytes 25% --hdd 1 --hdd-bytes 512M --timeout 40m --quiet &
          load=$!
          trap 'kill "$load" 2>/dev/null || true' EXIT
          sleep 5
          pass=0 fail=0
          for i in $(seq 20); do
            start=$(date +%s)
            rc=0
            (cd core/driver/docker && PORTENV_TEST_IMAGE=toolbox-node:stress \
              "$RUNNER_TEMP/docker.test" -test.count=1 -test.timeout 10m -test.run 'TestChannelConditions$' \
              > "$RUNNER_TEMP/run-$i.log" 2>&1) || rc=$?
            secs=$(( $(date +%s) - start ))
            if [[ $rc == 0 ]]; then
              pass=$((pass + 1)); echo "run $i: pass (${secs}s)"
            else
              fail=$((fail + 1)); echo "run $i: FAIL, exit $rc (${secs}s)"
              grep -E -- '--- FAIL|_test\.go:[0-9]+:' "$RUNNER_TEMP/run-$i.log" | sed -E 's/[0-9A-Fa-f]{64,}/[redacted]/g' || true
            fi
          done
          echo "TestChannelConditions under load: $pass passed, $fail failed, of 20"
          [[ $fail == 0 ]]
