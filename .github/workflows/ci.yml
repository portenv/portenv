# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          save: true
          build-cache: true
          tools: true
      - run: make build
      - name: tmux and zsh, for the agent's tab and shell-integration tests
        run: if ! command -v tmux || ! command -v zsh; then sudo apt-get update -q && sudo apt-get install -y -q tmux zsh; fi
      - name: sshd, for the host-key tests against real OpenSSH (run as this user, on 127.0.0.1)
        run: |
          if [ ! -x /usr/sbin/sshd ]; then sudo apt-get update -q && sudo apt-get install -y -q openssh-server; fi
          sudo mkdir -p /run/sshd
      - run: make test
      - name: Fuzz the helper's control-mode decoder (short budget)
        run: make fuzz
      - name: Lint
        if: matrix.arch == 'amd64'
        run: make lint

  agent-static:
    name: Static agent (linux/arm64, linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
      - run: make agent-linux

  proto:
    name: Protocols
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          tools: true
      # Lint and format run in the go job; this checks generated code is current.
      # Breaking-change checks (buf breaking) stay off until Phase 1.
      - run: make proto-check-go

  swift:
    name: Swift (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # proto-check and cli-darwin need Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          save: true
          tools: true
      # The Makefile needs GNU Make 4 or later; macOS ships 3.81.
      - name: GNU Make 4
        run: |
          brew install make
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
      - run: make --version | head -1
      # Regenerates Go and Swift from proto/ with the pinned plugins and fails
      # on any difference.
      - run: make proto-check
      - run: make swift-test
      # check-app-identity.sh's half of this test is macOS-only (Linux runs the rest in make test).
      - run: scripts/test-attached-terminal.sh
        env:
          MAKE: make
      # make swift-env-check (owner 2026-10-24: off PR CI for speed; runs
      # nightly) is in nightly-swift-env-check.yml.
      # Internal CLI artifacts (signed public releases: ADR 0009, later).
      - run: make cli-darwin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-darwin
          path: bin/dist/
          retention-days: 1

  cli-linux:
    name: CLI (linux/arm64, linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
      - run: make cli-linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux
          path: bin/dist/
          retention-days: 1

  # One artifact per commit, portenv-cli-<commit>, with checksums.txt: what
  # the server setup and the gate download (scripts/fetch-cli.sh).
  cli:
    name: CLI artifacts
    needs: [cli-linux, swift]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          chmod +x ./*
          sha256sum -- * > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portenv-cli-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          retention-days: 90

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          tools: true
      # Pull requests scan only their own commits; pushes to main scan main's
      # whole history (HEAD), never other branches. The nightly job scans
      # every branch (nightly-secret-scan.yml). An unmerged branch's commit
      # never turns a PR or main red.
      - run: make secrets
        env:
          SECRETS_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || 'HEAD' }}
