# SPDX-License-Identifier: Apache-2.0
#
# The full secret scan, every night: the whole history of every branch and the
# working tree. Pull requests scan only their own commits and pushes to main
# only main's history (ci.yml), so this is what covers every branch. On a
# failure it opens or updates the "Nightly secret scan failed" issue with a
# redacted excerpt; the next passing run closes it.
name: Nightly secret scan

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ISSUE_TITLE: Nightly secret scan failed

jobs:
  secrets:
    name: Full secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write # open, comment on and close the "Nightly secret scan failed" issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Cache pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Scan
        id: scan
        # Never stops the job here: the result is reported below, then the job
        # fails loudly if the scan did. gitleaks runs with --redact.
        run: |
          set -o pipefail
          rc=0
          make secrets > scan.log 2>&1 || rc=$?
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          echo "make secrets exit: $rc"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_EXIT: ${{ steps.scan.outputs.exit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          open=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
          if [[ ${SCAN_EXIT:-1} == 0 ]]; then
            if [[ -n $open ]]; then
              gh issue comment "$open" --body "Passed: $RUN_URL. Closing."
              gh issue close "$open"
              echo "closed #$open"
            fi
            exit 0
          fi
          if [[ -f scan.log ]]; then
            excerpt=$(scripts/scan-excerpt.sh scan.log)
          else
            excerpt="(no log: the scan step didn't run)"
          fi
          body=$(printf 'The nightly secret scan failed (make secrets exit %s): %s\n\nFindings are redacted; run gmake secrets locally to see which files and rules.\n\n~~~\n%s\n~~~\n' \
            "${SCAN_EXIT:-unknown}" "$RUN_URL" "$excerpt")
          if [[ -n $open ]]; then
            gh issue comment "$open" --body "$body"
            echo "commented on #$open"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
      - name: Fail loudly
        if: steps.scan.outputs.exit != '0'
        run: |
          echo "::error title=Nightly secret scan failed::make secrets exit ${{ steps.scan.outputs.exit }}; see the issue \"$ISSUE_TITLE\""
          exit 1
