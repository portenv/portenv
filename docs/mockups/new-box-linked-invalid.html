<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New workspace</title>
</head>
<body>

<style>
body{margin:0;background:#0E0E10}
a{color:#409CFF}a:hover{color:#6CB6FF}
</style>

<div style="width: 720px; height: 520px; box-sizing: border-box; display: flex; flex-direction: column; background: #1E1E20; color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; font-size: 13px; border: 1px solid #3A3A3D; border-radius: 12px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px">
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
<button type="button" aria-label="Back to your workspaces" style="display: flex; align-items: center; gap: 4px; margin-left: 14px; min-height: 26px; padding: 0 8px; background: transparent; color: #A1A1A6; border: none; border-radius: 6px; font: inherit; cursor: pointer">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Your workspaces</button>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 4px 64px 0">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">New workspace</h1>

<div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); align-items: start; gap: 14px 16px">
<label for="nb-name" style="color: #A1A1A6; text-align: right; line-height: 30px">Name</label>
<span style="display: flex; flex-direction: column; gap: 5px">
<input id="nb-name" type="text" value="-api" aria-describedby="nb-hint" aria-invalid="true" style="height: 30px; padding: 0 10px; box-sizing: border-box; background: #2A2A2D; color: #F5F5F7; border: 1px solid #FF6961; border-radius: 7px; font: inherit">
<span id="nb-hint" style="font-size: 12px; color: #FF8A80">Start with a letter or a number.</span>
</span>

<span id="nb-start" style="color: #A1A1A6; text-align: right; line-height: 30px">Start from</span>
<div role="radiogroup" aria-labelledby="nb-start" style="display: flex; padding: 2px; background: #2A2A2D; border: 1px solid #48484B; border-radius: 8px">
<button type="button" role="radio" aria-checked="true" style="flex: 1 1 0; min-height: 28px; background: #48484B; color: #F5F5F7; border: none; border-radius: 6px; font: inherit; cursor: pointer">GitHub repository</button>
<button type="button" role="radio" aria-checked="false" style="flex: 1 1 0; min-height: 28px; background: transparent; color: #F5F5F7; border: none; border-radius: 6px; font: inherit; cursor: pointer">Folder on this Mac</button>
<button type="button" role="radio" aria-checked="false" style="flex: 1 1 0; min-height: 28px; background: transparent; color: #F5F5F7; border: none; border-radius: 6px; font: inherit; cursor: pointer">Empty</button>
</div>

<span style="color: #A1A1A6; text-align: right; line-height: 30px">Repository</span>
<span style="display: flex; flex-direction: column; gap: 5px">
<span style="display: flex; align-items: center; height: 30px; padding: 0 10px; box-sizing: border-box; background: #2A2A2D; border: 1px solid #48484B; border-radius: 7px"><span style="flex-grow: 1">your-org/acme-api</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
<span style="font-size: 12px; color: #8E8E93">Linked as @your-name, same access as on your Mac · <a href="#">Switch Account…</a></span>
</span>

<span style="color: #A1A1A6; text-align: right">Toolbox</span>
<span style="display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap"><span>Node 22 · PostgreSQL client · Claude Code · git · gh</span><a href="#">Change…</a></span>
<span style="font-size: 12px; color: #8E8E93">Detected from the repository’s package.json</span>
</span>
</div>

<label style="display: flex; align-items: flex-start; gap: 10px; margin-left: 126px; cursor: pointer">
<input type="checkbox" checked="checked" style="width: 16px; height: 16px; margin: 1px 0 0; accent-color: #0A84FF">
<span>Show this workspace in Finder</span>
</label>
</div>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 0 64px 28px">
<button type="button" style="min-height: 34px; padding: 0 16px; background: #3A3A3D; color: #F5F5F7; border: none; border-radius: 8px; font: inherit; cursor: pointer">Cancel</button>
<button type="button" aria-disabled="true" style="min-height: 34px; padding: 0 18px; background: #2E3A48; color: #7C8796; border: none; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer">Create Workspace</button>
</div>
</div>
</body>
</html>
