syntax = "proto3";

// UNSTABLE: skeleton only. The API of portenv-agent, the box's init process,
// as portenvd and the runner call it. Terminals, lanes, port discovery and
// audit are designed in Phase 1; anything here may change.
package portenv.agent.v1;

import "portenv/types/v1/types.proto";

// The agent inside every box.
service AgentService {
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  // Reports whether the box has finished starting (users created, home
  // checked, packages installed).
  rpc GetReadiness(GetReadinessRequest) returns (GetReadinessResponse);
  // Runs one allow-listed restic command as portenv-sync (ADR 0005). The
  // input carries the password and storage credentials; it is never logged.
  rpc RunRestic(RunResticRequest) returns (RunResticResponse);
  // Describes a path under /home for the sync engine.
  rpc GetPathInfo(GetPathInfoRequest) returns (GetPathInfoResponse);
  // Attaches a terminal to one of work's tmux sessions (created if needed).
  // The first message from the client must be open.
  rpc Terminal(stream TerminalRequest) returns (stream TerminalResponse);
}

message RunResticRequest {
  // restic's arguments, without the binary name.
  repeated string args = 1;
  // The JSON input of portenv-agent restic: password, storage environment
  // and SFTP key.
  bytes input = 2;
}

message RunResticResponse {
  bytes stdout = 1;
  bytes stderr = 2;
  int32 exit_code = 3;
}

message GetPathInfoRequest {
  string path = 1;
}

message GetPathInfoResponse {
  bool exists = 1;
  bool is_dir = 2;
  bool empty = 3;
}

message TerminalRequest {
  oneof msg {
    TerminalOpen open = 1;
    // Keystrokes and pasted text.
    bytes input = 2;
    TerminalSize resize = 3;
  }
}

message TerminalOpen {
  // The tmux session, for example "main".
  string session = 1;
  TerminalSize size = 2;
}

message TerminalSize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalResponse {
  oneof msg {
    bytes output = 1;
    // The terminal ended (the tmux client exited or detached).
    int32 exit_code = 2;
  }
}

message GetVersionRequest {}

message GetVersionResponse {
  portenv.types.v1.BuildInfo build = 1;
}

message GetReadinessRequest {}

// Where the box is in its start sequence.
enum ReadinessState {
  READINESS_STATE_UNSPECIFIED = 0;
  // Still starting: users, home checks, package replay.
  READINESS_STATE_STARTING = 1;
  // Started; the box is usable.
  READINESS_STATE_READY = 2;
  // The start sequence failed; detail says why. The box stays up so the
  // failure can be inspected.
  READINESS_STATE_FAILED = 3;
}

message GetReadinessResponse {
  ReadinessState state = 1;
  // Human-readable step or failure, e.g. "installing 2 packages".
  string detail = 2;
}
