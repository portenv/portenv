# SPDX-License-Identifier: Apache-2.0
#
# Toolbox images. Every change builds and tests each architecture on its own
# native runner (no emulation). A tag "toolbox-node/vN" also pushes each
# architecture and then publishes one multi-arch manifest,
# ghcr.io/portenv/toolbox-node:vN.
name: Images

on:
  pull_request:
    paths:
      - images/**
      - core/**
      - proto/gen/go/**
      - go.work
      - .dockerignore
      - .github/workflows/images.yml
  push:
    branches: [main]
    paths:
      - images/**
      - core/**
      - proto/gen/go/**
      - go.work
      - .dockerignore
      - .github/workflows/images.yml
    tags:
      - toolbox-node/v*

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/portenv/toolbox-node

jobs:
  build:
    name: toolbox-node (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write # used only when pushing a tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          docker build --platform "linux/${{ matrix.arch }}" \
            --build-arg VERSION="$(git describe --tags --always)" \
            --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            -f images/toolbox-node/Dockerfile -t toolbox-node:test .
      - name: Test
        run: images/toolbox-node/test.sh toolbox-node:test
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Driver conformance
        run: make driver-test IMAGE=toolbox-node:test
      - name: End-to-end (restic isolation, two machines)
        run: make e2e IMAGE=toolbox-node:test
      - name: Push ${{ matrix.arch }}
        if: startsWith(github.ref, 'refs/tags/toolbox-node/v')
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#toolbox-node/}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag toolbox-node:test "$IMAGE:$version-${{ matrix.arch }}"
          docker push "$IMAGE:$version-${{ matrix.arch }}"

  manifest:
    name: Publish multi-arch manifest
    if: startsWith(github.ref, 'refs/tags/toolbox-node/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Create and push manifest
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#toolbox-node/}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "$IMAGE:$version" \
            "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          docker buildx imagetools inspect "$IMAGE:$version"
