syntax = "proto3";

// UNSTABLE: skeleton only. The API of portenv-agent, the box's init process,
// as portenvd and the runner call it. Terminals, lanes, port discovery and
// audit are designed in Phase 1; anything here may change.
package portenv.agent.v1;

import "portenv/types/v1/types.proto";

// The agent inside every box.
service AgentService {
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  // Reports whether the box has finished starting (users created, home
  // checked, packages installed).
  rpc GetReadiness(GetReadinessRequest) returns (GetReadinessResponse);
}

message GetVersionRequest {}

message GetVersionResponse {
  portenv.types.v1.BuildInfo build = 1;
}

message GetReadinessRequest {}

// Where the box is in its start sequence.
enum ReadinessState {
  READINESS_STATE_UNSPECIFIED = 0;
  // Still starting: users, home checks, package replay.
  READINESS_STATE_STARTING = 1;
  // Started; the box is usable.
  READINESS_STATE_READY = 2;
  // The start sequence failed; detail says why. The box stays up so the
  // failure can be inspected.
  READINESS_STATE_FAILED = 3;
}

message GetReadinessResponse {
  ReadinessState state = 1;
  // Human-readable step or failure, e.g. "installing 2 packages".
  string detail = 2;
}
