syntax = "proto3";

// Types shared by every Portenv protocol: boxes, snapshots and leases.
package portenv.types.v1;

import "google/protobuf/timestamp.proto";

// A box: a toolbox image plus a portable home. Only the home travels between
// machines; the image is pulled or rebuilt on each one.
message Box {
  // Stable identifier, unique per account. Names the box's restic repository
  // (<storage>/boxes/<id>).
  string id = 1;
  // Display name, shown as the window title. May change; never used as a key.
  string name = 2;
  // OCI image reference of the toolbox, e.g. "portenv/toolbox-node:v12".
  string toolbox_image = 3;
  // Start-time settings from the Box Settings window.
  Resources resources = 4;
}

// Lifecycle state of a box on one machine, as its driver reports it.
enum BoxState {
  BOX_STATE_UNSPECIFIED = 0;
  // Created by the driver, not started.
  BOX_STATE_CREATED = 1;
  BOX_STATE_STARTING = 2;
  BOX_STATE_RUNNING = 3;
  BOX_STATE_STOPPING = 4;
  BOX_STATE_STOPPED = 5;
  // The driver could not start or keep the box running.
  BOX_STATE_FAILED = 6;
}

// Start-time settings. Changing one restarts the box after a save.
message Resources {
  // CPU limit in thousandths of a CPU. 0 means no limit.
  uint32 cpu_millis = 1;
  // Memory limit in bytes. 0 means no limit.
  uint64 memory_bytes = 2;
  // Size of /dev/shm in bytes, for browsers. 0 means the default (1 GiB).
  uint64 shared_memory_bytes = 3;
  // Run a Docker engine inside the box. Off by default.
  bool docker_in_box = 4;
  // Pass a GPU through to the box. Off by default.
  bool gpu = 5;
}

// CPU architecture of a machine or an image.
enum Architecture {
  ARCHITECTURE_UNSPECIFIED = 0;
  ARCHITECTURE_ARM64 = 1;
  ARCHITECTURE_AMD64 = 2;
}

// Why a snapshot was made. Stored as a restic tag.
enum SnapshotKind {
  SNAPSHOT_KIND_UNSPECIFIED = 0;
  // Untagged autosave while the box is open.
  SNAPSHOT_KIND_AUTOSAVE = 1;
  // Tag "release": saved when the box was closed and its lease released.
  SNAPSHOT_KIND_RELEASE = 2;
  // Tag "point": a save point; the box stayed open.
  SNAPSHOT_KIND_POINT = 3;
  // Tag "orphaned": unsaved work kept during a conflict. Never pruned.
  SNAPSHOT_KIND_ORPHANED = 4;
}

// A restic snapshot of a box's /home. Snapshot host is always "portenv" and
// path is always "/home".
message SnapshotRef {
  // restic snapshot ID. Retagging rewrites the snapshot and changes this ID,
  // so re-read the newest snapshot after every tag change.
  string id = 1;
  string box_id = 2;
  google.protobuf.Timestamp time = 3;
  // Machine that made the snapshot (tag "machine:<id>").
  string machine_id = 4;
  SnapshotKind kind = 5;
  // Set when the snapshot carries "active:<machine-id>": the offline lease
  // fallback. Empty otherwise.
  string active_machine_id = 6;
}

// Where a lease record comes from.
enum LeaseSource {
  LEASE_SOURCE_UNSPECIFIED = 0;
  // The "active:" tag on the newest snapshot (before Phase 3, or offline).
  LEASE_SOURCE_SNAPSHOT_TAG = 1;
  // The control plane (authoritative from Phase 3).
  LEASE_SOURCE_CONTROL_PLANE = 2;
}

// One machine's claim to hold a box open. At most one machine holds a box's
// lease unless the user explicitly took over.
message Lease {
  string box_id = 1;
  string machine_id = 2;
  google.protobuf.Timestamp since = 3;
  // Unset for snapshot-tag leases. A lease without a heartbeat for 10 minutes
  // is shown as stale, never released automatically.
  google.protobuf.Timestamp last_heartbeat = 4;
  LeaseSource source = 5;
}

// Build information reported by every Portenv binary.
message BuildInfo {
  // Semantic version, or "dev" for local builds.
  string version = 1;
  // Git commit the binary was built from.
  string commit = 2;
  // One build of the app and its helpers (gmake app): different for every
  // build, a lane's or a dev build of the same commit too. The app restarts
  // a portenvd whose build_id isn't its own (R-0198).
  string build_id = 3;
}

// A tab in the box's terminal: one tmux window in the box's session
// (GUIDELINES.md §3, §4.1). The app owns names and order; order is the
// order of the list.
message Tab {
  // Stable for the window's life (tmux's window ID, for example "@3").
  string id = 1;
  string name = 2;
  // The tab this viewer's terminal shows.
  bool active = 3;
  // The program running in the tab's foreground, or empty when it's just
  // the shell (closing the tab asks first when it isn't empty).
  string program = 4;
  // The foreground command's whole command line, as one line (at most 160
  // characters), for the Move confirmation (2.3): shown on this Mac only.
  // It can hold secrets (mysql -p…, TOKEN=… ./deploy), so it's never
  // logged, never in Send Feedback or a crash report (R-0140). Empty when
  // the tab is just the shell.
  string command = 5;
  // When that command started.
  google.protobuf.Timestamp running_since = 6;
  // The agent whose tmux server the tab is on (ADR 0022 §1); empty for the
  // owner's tabs. Tab ids stay unique across servers: an agent's carry its
  // id as a prefix.
  string agent_id = 7;
  // The tab's panes (tmux pane IDs, for example "%4"), in tmux's order.
  repeated string pane_ids = 8;
}

// How a tab's terminal ended (ADR 0020): shared by portenvd's TabTerminal
// and the app. Kept here, not in daemon.proto, so adding it moves none of
// the daemon's generated type indices.
enum TabTerminalEnd {
  TAB_TERMINAL_END_UNSPECIFIED = 0;
  // The tab was closed (by anyone), or the tab asked for doesn't exist.
  TAB_TERMINAL_END_TAB_CLOSED = 1;
  // The box is stopping, or moving away.
  TAB_TERMINAL_END_BOX_STOPPING = 2;
}

// Where a server's host key stands.
enum ServerKeyState {
  SERVER_KEY_STATE_UNSPECIFIED = 0;
  // No key pinned yet: nothing runs on it ("Confirm NAME to open this").
  SERVER_KEY_STATE_UNCONFIRMED = 1;
  // Its key is pinned and checked on every connection.
  SERVER_KEY_STATE_CONFIRMED = 2;
  // It answered with another key, or this Mac's SSH recorded another one:
  // nothing runs on it, and there's no trusting it anyway.
  SERVER_KEY_STATE_CHANGED = 3;
}

// One line of Add a Server's Check (ADR 0021 §3).
enum CheckState {
  CHECK_STATE_UNSPECIFIED = 0;
  CHECK_STATE_PASSED = 1;
  // Says what to do in fix. Nothing installs until no line fails.
  CHECK_STATE_FAILED = 2;
  // Recorded, never a failure (KVM, an existing install).
  CHECK_STATE_INFO = 3;
}

// ADR 0022: the agent team. Shared by daemon.proto (the app) and agent.proto
// (the helper), and kept here so adding them moves none of either file's
// generated type indices.

// Where an agent stands, for the Team sidebar (ADR 0022 §8).
enum AgentState {
  AGENT_STATE_UNSPECIFIED = 0;
  AGENT_STATE_STOPPED = 1;
  AGENT_STATE_STARTING = 2;
  AGENT_STATE_RUNNING = 3;
  // A prompt on screen and nothing happening (ADR 0017's waiting detector).
  AGENT_STATE_IDLE = 4;
  // A pending decision from it, or it's waiting at a question.
  AGENT_STATE_NEEDS_YOU = 5;
  // Its agent file fails validation; AgentInfo.problem says why.
  AGENT_STATE_INVALID = 6;
  // Remote agents only (§10), after the owner's run.
  AGENT_STATE_CONNECTED = 7;
  AGENT_STATE_DISCONNECTED = 8;
}

// A board message's type (ADR 0022 §6).
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_QUESTION = 1;
  MESSAGE_TYPE_ANSWER = 2;
  // Information, from an agent or from Portenv (a grant change, a package
  // installed, a decision answered or expired).
  MESSAGE_TYPE_NOTICE = 3;
  // The owner asks an agent what it's working on (R-0256).
  MESSAGE_TYPE_STATUS_REQUEST = 4;
  // A routine's note, delivered by Portenv (R-0258).
  MESSAGE_TYPE_ROUTINE = 5;
  // Files handed over to the recipient's ~/inbox (R-0257 item 3).
  MESSAGE_TYPE_HANDOFF = 6;
}

// What a decision asks the owner for (ADR 0022 §6).
enum DecisionKind {
  DECISION_KIND_UNSPECIFIED = 0;
  // portenv ask-owner: Approve only says yes.
  DECISION_KIND_ASK_OWNER = 1;
  // portenv split or tab new under panes: ask.
  DECISION_KIND_PANE = 2;
  // portenv propose-agent-change, with the diff.
  DECISION_KIND_AGENT_FILE_CHANGE = 3;
  // An agent file's share_login (§2).
  DECISION_KIND_SHARE_LOGIN = 4;
  // portenv request-package: Approve installs exactly the listed set.
  DECISION_KIND_PACKAGE = 5;
  // The first start of a team, with §2's residual-risk sentence (R-0245).
  DECISION_KIND_TEAM_START = 6;
  // Remove and delete an agent's files, with the size (§1).
  DECISION_KIND_DELETE_AGENT_FILES = 7;
}

// Where a decision stands. Expired is final: an expired decision never
// becomes approved; the agent is told "expired, ask again" (R-0245).
enum DecisionState {
  DECISION_STATE_UNSPECIFIED = 0;
  DECISION_STATE_PENDING = 1;
  DECISION_STATE_APPROVED = 2;
  DECISION_STATE_DECLINED = 3;
  DECISION_STATE_EXPIRED = 4;
}

// An agent file's grant for panes and packages (ADR 0022 §3).
enum GrantMode {
  GRANT_MODE_UNSPECIFIED = 0;
  // Each use is a decision for the owner.
  GRANT_MODE_ASK = 1;
  // At once. Not valid for packages.
  GRANT_MODE_ALLOW = 2;
  // Refused with a plain line.
  GRANT_MODE_NEVER = 3;
}

// One line of the board's messages.jsonl (ADR 0022 §6, ADR 0016's message).
// Text is plain text: never Markdown, UI or instructions.
message BoardMessage {
  // A ULID.
  string id = 1;
  // An agent id, or "owner", or "portenv" for Portenv's own notices.
  string from = 2;
  // An agent id, or "owner".
  string to = 3;
  string thread_id = 4;
  MessageType type = 5;
  // At most 8 KB.
  string text = 6;
  google.protobuf.Timestamp created_at = 7;
  // For MESSAGE_TYPE_HANDOFF: what landed in the recipient's inbox.
  repeated HandoffFile files = 8;
  // For Portenv's notices about one agent (a start that failed): its id,
  // so the app shows the notice in that agent's column. Empty otherwise.
  string about = 9;
}

// A request for the owner (ADR 0022 §6). Only the app answers it.
message Decision {
  // A ULID.
  string id = 1;
  // The agent that asked.
  string from = 2;
  DecisionKind kind = 3;
  // At most 200 characters.
  string summary = 4;
  // At most 32 KB: the question, the command, the diff, the package list.
  string detail = 5;
  DecisionState state = 6;
  string answer_note = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp answered_at = 9;
  // For DECISION_KIND_PACKAGE: exactly what Approve installs.
  repeated PackagePlan packages = 10;
  // When a pending decision expires (24 hours after created_at).
  google.protobuf.Timestamp expires_at = 11;
  // For DECISION_KIND_TEAM_START: the agents the owner clicked Start on,
  // in that order. portenvd starts them itself on Approve, so the answer
  // works after the app or portenvd restarts (R-0296).
  repeated string start_agent_ids = 12;
}

// One package apt-get -s would install, run by init (root), never by the
// agent (ADR 0022 §6, R-0245 item 5).
message PackagePlan {
  string name = 1;
  // The exact version; Approve installs name=version.
  string version = 2;
  // The configured repository it comes from, as apt names it.
  string source = 3;
  // Pulled in by the requested package.
  bool dependency = 4;
}

// An agent's effective grant, after personal overrides (ADR 0022 §3).
message AgentGrant {
  GrantMode panes = 1;
  int32 max_panes = 2;
  // Agent ids it may message; the owner is always allowed.
  repeated string message = 3;
  bool ask_owner = 4;
  // ASK or NEVER.
  GrantMode packages = 5;
  // team_status: read (R-0257 item 1): teammates' state, status, pending
  // count and last activity in whoami and portenv team status. Off by
  // default; never terminals or homes.
  bool team_status = 6;
  // read_clones (ADR 0022 §2a, lenses): team agents with their own clone
  // whose clone this agent may read, never write: a named-user read ACL
  // on the clone and traverse on that agent's home, never through group
  // team.
  repeated string read_clones = 7;
}

// A file or folder in an agent's home, for the Agent files view (§2).
message AgentFile {
  // Relative to the agent's home.
  string path = 1;
  bool dir = 2;
  int64 size = 3;
  google.protobuf.Timestamp modified = 4;
}

// What an agent says it's working on (R-0256): information, never an
// instruction. Plain text, at most 200 characters.
message AgentStatus {
  string text = 1;
  // Progress N of M; both 0 when not given.
  int32 progress_done = 2;
  int32 progress_total = 3;
  // Why it's blocked, if it is.
  string blocked = 4;
  google.protobuf.Timestamp set_at = 5;
}

// One file of a hand-off, as it landed in the recipient's home.
message HandoffFile {
  // Relative to the recipient's home: inbox/<sender>/<timestamp>/...
  string path = 1;
  string sha256 = 2;
  int64 size = 3;
}

// A routine from an agent file (R-0258): portenvd keeps the timer.
message Routine {
  // At least 10 minutes, in minutes.
  int32 every_minutes = 1;
  // One plain line, at most 200 characters.
  string note = 2;
  bool paused = 3;
  google.protobuf.Timestamp next_at = 4;
}
