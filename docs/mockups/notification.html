<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portenv notification</title>

</head>
<body>


<style>
body{margin:0;background:#0E0E10}
</style>

<div style="width: 480px; height: 200px; box-sizing: border-box; padding: 20px; display: flex; align-items: flex-start; justify-content: center; background: #2F3B4A; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; font-size: 13px; color: #F5F5F7">
<div role="alert" aria-label="Portenv notification" style="width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; box-sizing: border-box; background: #2A2A2D; border: 1px solid #48484A; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.45)">
<div style="display: flex; gap: 12px; align-items: flex-start">
<span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 38px; height: 38px; border-radius: 9px; background: #1D1D1F; border: 1px solid #3A3A3D">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F5F5F7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"></path><path d="M5 20V10l7-6 7 6v10"></path><path d="M10 20v-5h4v5"></path></svg>
</span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<div style="display: flex; gap: 8px"><span style="flex-grow: 1; font-weight: 600">acme-api · Claude Code is asking</span><span style="font-size: 12px; color: #A1A1A6">now</span></div>
<span>Push fix/retries to the remote?</span>
<span style="font-size: 12px; color: #A1A1A6">Started by Grok Bot in the claude tab</span>
</div>
</div>
<div style="display: flex; gap: 8px">
<button type="button" style="flex: 1 1 0; min-height: 30px; background: #3A3A3D; color: #F5F5F7; border: none; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer">Yes, push</button>
<button type="button" style="flex: 1 1 0; min-height: 30px; background: #3A3A3D; color: #F5F5F7; border: none; border-radius: 8px; font: inherit; cursor: pointer">Not yet</button>
<button type="button" style="flex: 1 1 0; min-height: 30px; background: #3A3A3D; color: #F5F5F7; border: none; border-radius: 8px; font: inherit; cursor: pointer">Show</button>
</div>
</div>
</div>


</body>
</html>
